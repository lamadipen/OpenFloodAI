<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Original image-sequence validation flow, before the evidence adapter existed</title>
<desc>User clicks Run validation in site.html, which posts to the home server, which runs run_image_sequence_validation. For every image it always calls compare_region_signals, then classifies the result by reading the raw signals dictionary directly. It writes a single file, image-sequence-records.jsonl, and the review page shows only the result, with no evidence record and no way to enable or disable anything.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #555; }
  .arr { stroke: #888; stroke-width: 1.5; }
  .box-gray { fill: #f1efe8; stroke: #888780; stroke-width: 0.5; }
</style>

<g>
  <rect class="box-gray" x="180" y="40" width="320" height="44" rx="4"/>
  <text x="340" y="58" text-anchor="middle" class="th">Click "Run validation"</text>
  <text x="340" y="76" text-anchor="middle" class="ts">site.html button</text>
</g>
<line x1="340" y1="84" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box-gray" x="180" y="104" width="320" height="44" rx="4"/>
  <text x="340" y="122" text-anchor="middle" class="th">Home server receives it</text>
  <text x="340" y="140" text-anchor="middle" class="ts">POST /api/run-image-sequence-validation</text>
</g>
<line x1="340" y1="148" x2="340" y2="168" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box-gray" x="180" y="168" width="320" height="44" rx="4"/>
  <text x="340" y="186" text-anchor="middle" class="th">run_image_sequence_validation()</text>
  <text x="340" y="204" text-anchor="middle" class="ts">for each image in the sequence</text>
</g>
<line x1="340" y1="212" x2="340" y2="232" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box-gray" x="180" y="232" width="320" height="44" rx="4"/>
  <text x="340" y="250" text-anchor="middle" class="th">compare_region_signals()</text>
  <text x="340" y="268" text-anchor="middle" class="ts">always runs, no on/off switch</text>
</g>
<line x1="340" y1="276" x2="340" y2="296" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box-gray" x="180" y="296" width="320" height="44" rx="4"/>
  <text x="340" y="314" text-anchor="middle" class="th">_classify_comparison()</text>
  <text x="340" y="332" text-anchor="middle" class="ts">reads the raw signals dict directly</text>
</g>
<line x1="340" y1="340" x2="340" y2="360" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box-gray" x="180" y="360" width="320" height="44" rx="4"/>
  <text x="340" y="378" text-anchor="middle" class="th">Write one JSONL file</text>
  <text x="340" y="396" text-anchor="middle" class="ts">image-sequence-records.jsonl</text>
</g>
<line x1="340" y1="404" x2="340" y2="424" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box-gray" x="180" y="424" width="320" height="44" rx="4"/>
  <text x="340" y="442" text-anchor="middle" class="th">Review page shows the result</text>
  <text x="340" y="460" text-anchor="middle" class="ts">no evidence panel yet</text>
</g>

<text x="340" y="500" text-anchor="middle" class="ts">No adapter, no evidence record, no enable/disable setting existed at this point</text>
</svg>
