<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Details · OpenFloodAI</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef3f6;
        --panel: #ffffff;
        --panel-2: #f7fafc;
        --ink: #1f2933;
        --muted: #667085;
        --faint: #98a2b3;
        --line: #e1e7ec;
        --soft-line: #edf1f5;
        --ok: #176c4f;
        --ok-bg: #e8f6ef;
        --warn: #9a5b13;
        --warn-bg: #fff6df;
        --missing: #9b1c31;
        --missing-bg: #fff0f3;
        --accent: #1769aa;
        --accent-strong: #0d4d7d;
        --accent-bg: #e9f4fb;
        --shadow-sm: 0 2px 8px rgba(31, 41, 51, 0.06);
        --shadow: 0 18px 45px rgba(31, 41, 51, 0.1);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background:
          linear-gradient(180deg, #ddebf2 0, rgba(238, 243, 246, 0) 340px),
          var(--bg);
        color: var(--ink);
        font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
      }

      a {
        color: var(--accent);
      }

      [hidden] {
        display: none !important;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      /* ---------- Top bar ---------- */

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
      }

      .topbar-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 6px 10px;
        border-radius: 8px;
        white-space: nowrap;
      }

      .back-link:hover {
        background: var(--panel-2);
        color: var(--ink);
      }

      .brand {
        font-weight: 800;
        color: var(--accent-strong);
        font-size: 15px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .topbar-spacer {
        flex: 1 1 auto;
      }

      .site-switcher {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .site-switcher label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      select,
      input[type="text"],
      input[type="number"] {
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--panel);
        color: var(--ink);
      }

      #siteSwitcher {
        min-width: 0;
        max-width: 100%;
        flex: 1 1 180px;
      }

      /* ---------- Layout ---------- */

      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 26px 28px;
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
        justify-content: space-between;
      }

      .hero-title {
        min-width: 260px;
      }

      .hero-eyebrow {
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }

      .hero h1 {
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 800;
        word-break: break-word;
      }

      .hero-path {
        color: var(--faint);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .hero-badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .hero-explanation {
        color: var(--faint);
        font-size: 13px;
        margin: 8px 0 0;
        max-width: 480px;
      }

      .hero-stats {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }

      .hero-stat {
        text-align: center;
        min-width: 80px;
      }

      .hero-stat-value {
        font-size: 26px;
        font-weight: 800;
        color: var(--accent-strong);
      }

      .hero-stat-label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      /* ---------- Badges ---------- */

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .badge.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }

      .badge.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }

      .badge.missing {
        background: var(--missing-bg);
        color: var(--missing);
      }

      .badge.neutral {
        background: var(--accent-bg);
        color: var(--accent-strong);
      }

      .badge.plain {
        background: var(--panel-2);
        color: var(--muted);
      }

      /* ---------- Tabs ---------- */

      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
        overflow-x: auto;
      }

      .tab {
        background: transparent;
        border: 0;
        padding: 12px 18px;
        font-weight: 700;
        color: var(--muted);
        border-bottom: 3px solid transparent;
        white-space: nowrap;
      }

      .tab:hover {
        color: var(--ink);
      }

      .tab[aria-selected="true"] {
        color: var(--accent-strong);
        border-bottom-color: var(--accent-strong);
      }

      .tab-panel {
        animation: fade-in 0.15s ease-out;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ---------- Cards ---------- */

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        padding: 20px 22px;
        margin-bottom: 18px;
      }

      .card-title {
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }

      .empty-state {
        text-align: center;
        padding: 34px 20px;
        color: var(--muted);
      }

      .empty-state-icon {
        font-size: 32px;
        margin-bottom: 8px;
      }

      /* ---------- Key/value grid ---------- */

      .kv-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px 22px;
      }

      .kv {
        min-width: 0;
      }

      .kv-label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 3px;
        overflow-wrap: anywhere;
      }

      .kv-value {
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      /* ---------- Quick actions ---------- */

      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 9px;
        padding: 9px 14px;
        font-weight: 650;
        font-size: 13.5px;
        text-decoration: none;
        transition: transform 0.05s ease-out, box-shadow 0.1s ease-out;
      }

      .btn:hover {
        box-shadow: var(--shadow-sm);
        transform: translateY(-1px);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .btn.primary {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
        color: #fff;
      }

      .btn.danger {
        background: var(--missing-bg);
        border-color: #f4c4cd;
        color: var(--missing);
      }

      .btn.small {
        padding: 6px 10px;
        font-size: 12.5px;
        border-radius: 7px;
      }

      /* ---------- Readiness checklist ---------- */

      .readiness-checks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }

      .readiness-check {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel-2);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
      }

      .readiness-check-label {
        color: var(--muted);
        font-weight: 600;
      }

      .readiness-check-value.ok {
        color: var(--ok);
        font-weight: 700;
      }

      .readiness-check-value.missing {
        color: var(--missing);
        font-weight: 700;
      }

      /* ---------- Videos ---------- */

      .video-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel-2);
      }

      .video-card-head {
        padding: 14px 16px 0;
      }

      .video-card-id {
        font-weight: 800;
        font-size: 15px;
        overflow-wrap: anywhere;
      }

      .video-card-filename {
        color: var(--faint);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .video-card-body {
        padding: 12px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .image-sequence-thumb-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }

      .image-sequence-thumb {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .image-sequence-thumb img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel-2);
      }

      .chip {
        font-size: 11.5px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--accent-bg);
        color: var(--accent-strong);
      }

      .video-note {
        font-size: 13px;
        color: var(--muted);
      }

      .video-preview-wrap {
        display: none;
        margin-top: 6px;
      }

      .video-preview-wrap.open {
        display: block;
      }

      .video-preview-wrap video {
        width: 100%;
        border-radius: 8px;
        background: #182b35;
      }

      .video-card-meta {
        font-size: 12px;
        color: var(--faint);
      }

      /* ---------- Config visuals ---------- */

      .region-preview {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: repeating-linear-gradient(
            45deg,
            #eef3f6 0 10px,
            #e4ecf1 10px 20px
          );
        border-radius: 10px;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
      }

      .region-preview svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .guide-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        background: var(--panel-2);
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }

      .guide-preview {
        width: 130px;
        height: 74px;
        flex: 0 0 auto;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .guide-info {
        flex: 1 1 220px;
        min-width: 0;
      }

      /* ---------- Runs ---------- */

      .compare-bar {
        position: sticky;
        bottom: 16px;
        z-index: 15;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: var(--accent-strong);
        color: #fff;
        border-radius: 12px;
        padding: 12px 18px;
        box-shadow: var(--shadow);
        margin: 10px 0;
      }

      .compare-bar.visible {
        display: flex;
      }

      .compare-bar .btn {
        background: #fff;
        color: var(--accent-strong);
        border: 0;
      }

      .compare-bar .btn.ghost {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .run-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 12px;
        background: var(--panel);
        overflow: hidden;
      }

      .run-card-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        cursor: pointer;
        flex-wrap: wrap;
      }

      .run-card-head:hover {
        background: var(--panel-2);
      }

      .run-checkbox {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      .run-head-main {
        flex: 1 1 220px;
        min-width: 0;
      }

      .run-id {
        font-weight: 800;
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .run-time {
        color: var(--faint);
        font-size: 12.5px;
      }

      .run-counts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .run-caret {
        color: var(--faint);
        transition: transform 0.15s ease-out;
        font-size: 13px;
      }

      .run-card.open .run-caret {
        transform: rotate(90deg);
      }

      .run-card-body {
        display: none;
        border-top: 1px solid var(--soft-line);
        padding: 16px;
      }

      .run-card.open .run-card-body {
        display: block;
      }

      .run-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .run-tab {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 11px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
      }

      .run-tab[aria-selected="true"] {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
        color: #fff;
      }

      .run-tab-panel {
        display: none;
      }

      .run-tab-panel.active {
        display: block;
      }

      .report-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--panel-2);
        border-radius: 8px;
        padding: 14px;
        font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 480px;
        overflow: auto;
      }

      .image-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }

      .image-gallery figure {
        margin: 0;
      }

      .image-gallery img {
        width: 100%;
        border-radius: 8px;
        display: block;
      }

      .image-gallery figcaption {
        font-size: 11px;
        color: var(--faint);
        overflow-wrap: anywhere;
        margin-top: 4px;
      }

      /* ---------- Compare table ---------- */

      .compare-table-wrap {
        overflow-x: auto;
      }

      table.compare-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      table.compare-table th,
      table.compare-table td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--soft-line);
        text-align: left;
        white-space: nowrap;
      }

      table.compare-table th {
        color: var(--muted);
        font-weight: 700;
        background: var(--panel-2);
        position: sticky;
        top: 0;
      }

      table.compare-table td.metric-label {
        font-weight: 700;
        color: var(--muted);
        position: sticky;
        left: 0;
        background: var(--panel);
      }

      table.compare-table td.differs {
        background: var(--warn-bg);
      }

      /* ---------- Misc ---------- */

      .loading-line {
        color: var(--muted);
        font-size: 13px;
        padding: 8px 0;
      }

      .status-line {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
      }

      .status-line.error {
        color: var(--missing);
      }

      .status-line.success {
        color: var(--ok);
      }

      @media (max-width: 640px) {
        .hero {
          flex-direction: column;
        }
        .topbar-inner {
          padding: 12px 16px;
        }
        .site-switcher {
          flex: 1 1 100%;
          min-width: 0;
        }
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <a class="back-link" href="/openfloodai-home-ui.html">&larr; All Sites</a>
        <span class="brand">OpenFloodAI</span>
        <div class="topbar-spacer"></div>
        <div class="site-switcher">
          <label for="siteSwitcher">Site</label>
          <select id="siteSwitcher"></select>
        </div>
      </div>
    </div>

    <main>
      <div id="loadError" class="card" hidden>
        <div class="card-title">Could not load this site</div>
        <p id="loadErrorText" class="status-line error"></p>
      </div>

      <div id="siteContent" hidden>
        <section class="hero">
          <div class="hero-title">
            <div class="hero-eyebrow">Validation site</div>
            <h1 id="siteName"></h1>
            <div class="hero-path" id="sitePath"></div>
            <div class="hero-badges" id="siteBadges"></div>
            <p class="hero-explanation" id="heroExplanation"></p>
          </div>
          <div class="hero-stats" id="heroStats"></div>
        </section>

        <nav class="tabs" role="tablist" aria-label="Site sections">
          <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
          <button class="tab" role="tab" data-tab="videos" aria-selected="false">Videos</button>
          <button class="tab" role="tab" data-tab="config" aria-selected="false">Config</button>
          <button class="tab" role="tab" data-tab="runs" aria-selected="false">Runs</button>
          <button class="tab" role="tab" data-tab="image-sequences" aria-selected="false">Image sequences</button>
        </nav>

        <section class="tab-panel" id="panel-overview" role="tabpanel"></section>
        <section class="tab-panel" id="panel-videos" role="tabpanel" hidden></section>
        <section class="tab-panel" id="panel-config" role="tabpanel" hidden></section>
        <section class="tab-panel" id="panel-runs" role="tabpanel" hidden></section>
        <section class="tab-panel" id="panel-image-sequences" role="tabpanel" hidden></section>
      </div>
    </main>

    <script>
      // ---------------------------------------------------------------
      // Shared state and small helpers
      // ---------------------------------------------------------------
      let latestSites = [];
      let currentSite = null;
      let manifestByVideoId = {};
      let siteConfig = null;
      const runDetailCache = new Map();
      const selectedRunIds = new Set();

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDateTime(value) {
        if (!value) return "Unknown time";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function fallback(value, text = "Not available") {
        return value === undefined || value === null || value === "" ? text : value;
      }

      function runDirFromReportPath(reportPath) {
        if (!reportPath) return null;
        return reportPath.replace(/\/validation-report\.md$/, "");
      }

      // ---------------------------------------------------------------
      // Bootstrap
      // ---------------------------------------------------------------
      const requestedSiteName = new URLSearchParams(window.location.search).get("site");
      const siteSwitcher = document.getElementById("siteSwitcher");
      const loadError = document.getElementById("loadError");
      const loadErrorText = document.getElementById("loadErrorText");
      const siteContent = document.getElementById("siteContent");

      async function bootstrap() {
        try {
          const response = await fetch("/api/sites");
          if (!response.ok) throw new Error(`Request failed: ${response.status}`);
          const payload = await response.json();
          latestSites = payload.sites || [];
          if (!latestSites.length) {
            showLoadError("No sites exist yet. Go back and create a site first.");
            return;
          }
          fillSiteSwitcher();
          const initial =
            latestSites.find((site) => site.site_name === requestedSiteName) || latestSites[0];
          siteSwitcher.value = initial.site_name;
          await selectSite(initial.site_name);
        } catch (error) {
          showLoadError(`Could not load site data: ${error.message}`);
        }
      }

      function showLoadError(message) {
        loadError.hidden = false;
        siteContent.hidden = true;
        loadErrorText.textContent = message;
      }

      function fillSiteSwitcher() {
        siteSwitcher.innerHTML = "";
        for (const site of latestSites) {
          const option = document.createElement("option");
          option.value = site.site_name;
          option.textContent = site.site_name;
          siteSwitcher.append(option);
        }
      }

      siteSwitcher.addEventListener("change", () => {
        const params = new URLSearchParams(window.location.search);
        params.set("site", siteSwitcher.value);
        history.replaceState(null, "", `${window.location.pathname}?${params.toString()}`);
        selectSite(siteSwitcher.value);
      });

      async function selectSite(siteName) {
        const site = latestSites.find((entry) => entry.site_name === siteName);
        if (!site) {
          showLoadError(`Site not found: ${siteName}`);
          return;
        }
        currentSite = site;
        selectedRunIds.clear();
        runDetailCache.clear();
        loadError.hidden = true;
        siteContent.hidden = false;
        renderHero(site);
        renderOverviewTab(site);
        renderVideosTab(site);
        renderConfigTab(site);
        renderRunsTab(site);
        renderImageSequencesTab(site);
        // Config and manifest are fetched lazily; both tabs render a loading
        // state immediately above, then fill in once these resolve.
        await Promise.all([loadSiteConfig(site), loadSiteManifest(site)]);
        renderVideosTab(site);
        renderConfigTab(site);
      }

      async function loadSiteConfig(site) {
        siteConfig = null;
        try {
          const response = await fetch(
            `/api/site-config?${new URLSearchParams({ folder_name: site.site_name })}`
          );
          if (!response.ok) return;
          const payload = await response.json();
          siteConfig = payload.config || null;
        } catch (error) {
          siteConfig = null;
        }
      }

      async function loadSiteManifest(site) {
        manifestByVideoId = {};
        try {
          const response = await fetch(
            `/api/site-manifest?${new URLSearchParams({ folder_name: site.site_name })}`
          );
          if (!response.ok) return;
          const payload = await response.json();
          for (const record of payload.records || []) {
            if (record && record.video_id) manifestByVideoId[record.video_id] = record;
          }
        } catch (error) {
          manifestByVideoId = {};
        }
      }

      // ---------------------------------------------------------------
      // Tabs
      // ---------------------------------------------------------------
      function activateTab(tabName) {
        const tab = document.querySelector(`.tab[data-tab="${tabName}"]`);
        if (!tab) return;
        for (const other of document.querySelectorAll(".tab")) {
          other.setAttribute("aria-selected", String(other === tab));
        }
        for (const panel of document.querySelectorAll(".tab-panel")) {
          panel.hidden = panel.id !== `panel-${tabName}`;
        }
      }

      for (const tab of document.querySelectorAll(".tab")) {
        tab.addEventListener("click", () => activateTab(tab.dataset.tab));
      }

      const requestedTab = new URLSearchParams(window.location.search).get("tab");
      if (requestedTab) {
        activateTab(requestedTab);
      }

      // ---------------------------------------------------------------
      // Hero
      // ---------------------------------------------------------------
      function statusBadge(ok, okText, missingText) {
        return ok
          ? `<span class="badge ok">&check; ${escapeHtml(okText)}</span>`
          : `<span class="badge missing">&times; ${escapeHtml(missingText)}</span>`;
      }

      function renderHero(site) {
        document.getElementById("siteName").textContent = site.site_name;
        document.getElementById("sitePath").textContent = site.site_path || "";
        document.getElementById("siteBadges").innerHTML = [
          statusBadge(site.ready_for_machine_review, "Machine ready", "Machine review not ready"),
          statusBadge(site.ready_for_human_comparison, "Compare ready", "Comparison not ready"),
        ].join("");
        const explanationParts = [];
        if (!site.ready_for_machine_review) {
          explanationParts.push(site.machine_review_explanation);
          if (site.video_count === 0 && site.image_sequence_count > 0) {
            explanationParts.push(
              "This is about the local-video flow only. Your USGS image sequence " +
              "is a separate flow and does not need a local video — see the " +
              "Image Sequences tab."
            );
          }
        }
        const heroExplanation = document.getElementById("heroExplanation");
        heroExplanation.textContent = explanationParts.join(" ");
        heroExplanation.hidden = explanationParts.length === 0;
        const scorecard = site.latest_scorecard || {};
        document.getElementById("heroStats").innerHTML = [
          ["Videos", site.video_count],
          ["Labels", site.label_count],
          ["Reports", site.report_count],
          ["Latest agree", fallback(scorecard.agree, "&mdash;")],
          ["Latest disagree", fallback(scorecard.disagree, "&mdash;")],
        ]
          .map(
            ([label, value]) => `
              <div class="hero-stat">
                <div class="hero-stat-value">${value}</div>
                <div class="hero-stat-label">${escapeHtml(label)}</div>
              </div>
            `
          )
          .join("");
      }

      // ---------------------------------------------------------------
      // Overview tab
      // ---------------------------------------------------------------
      function renderOverviewTab(site) {
        const panel = document.getElementById("panel-overview");
        const readiness = site.validation_readiness || {};
        const checks = (readiness.checks || [])
          .map(
            (check) => `
              <div class="readiness-check">
                <span class="readiness-check-label">${escapeHtml(check.label)}</span>
                <span class="readiness-check-value ${check.ok ? "ok" : "missing"}">${escapeHtml(check.value)}</span>
              </div>
            `
          )
          .join("");

        const scorecard = site.latest_scorecard;
        const scorecardCard = scorecard
          ? `
            <div class="card">
              <div class="card-title">Latest validation scorecard</div>
              <div class="kv-grid">
                ${kv("Videos tested", fallback(scorecard.videos_tested))}
                ${kv("Videos with a human label", `${fallback(scorecard.videos_with_human_label, "0")} of ${fallback(scorecard.videos_tested, "0")}`)}
                ${kv("Label windows", fallback(scorecard.label_windows))}
                ${kv("Agree", fallback(scorecard.agree))}
                ${kv("Disagree", fallback(scorecard.disagree))}
                ${kv("Cannot compare", fallback(scorecard.cannot_compare))}
                ${kv("Baseline-ready samples", fallback(scorecard.baseline_ready_samples))}
                ${kv("Practice-only samples", fallback(scorecard.practice_only_samples))}
              </div>
              <p class="status-line">${escapeHtml(scorecard.summary || "")}</p>
            </div>
          `
          : `
            <div class="card">
              <div class="card-title">Latest validation scorecard</div>
              <div class="empty-state">
                <div class="empty-state-icon">&#128202;</div>
                No validation has been run yet for this site.
              </div>
            </div>
          `;

        const explanations = (site.latest_result_explanations || [])
          .map(
            (result) => `
              <div class="kv" style="margin-bottom: 14px;">
                <div class="kv-label">${escapeHtml(result.video_id)} &middot; ${escapeHtml(result.time_window === "missing" ? "no human time window" : result.time_window)}</div>
                <div class="kv-value">${comparisonBadge(result.status)}</div>
                <div class="video-note" style="margin-top: 6px;"><strong>Machine:</strong> ${escapeHtml(result.machine_observation)}</div>
                <div class="video-note"><strong>Human:</strong> ${escapeHtml(result.human_observation)}</div>
                <div class="video-note"><strong>Why:</strong> ${escapeHtml(result.reason)}</div>
              </div>

          .join("");

        panel.innerHTML = `
          <div class="card">
            <div class="card-title">Quick actions</div>
            <div class="quick-actions">
              <button class="btn primary" id="runValidationButton" ${site.ready_for_validation ? "" : "disabled"}>&#9654; Run Validation</button>
              <a class="btn" href="/openfloodai-home-ui.html?site=${encodeURIComponent(site.site_name)}&action=add_video">+ Add Video</a>
              <a class="btn" href="/openfloodai-home-ui.html?site=${encodeURIComponent(site.site_name)}&action=add_label">+ Add Label</a>
              <a class="btn" href="/openfloodai-home-ui.html?site=${encodeURIComponent(site.site_name)}&action=set_watched_area">Set Watched Area</a>
              <a class="btn" href="/openfloodai-home-ui.html?site=${encodeURIComponent(site.site_name)}&action=set_normal_waterline_guide">Normal Waterline Guide</a>
              <a class="btn" href="/openfloodai-home-ui.html?site=${encodeURIComponent(site.site_name)}&action=watch">Watch</a>
              <button class="btn danger" id="deleteSiteButton">Delete Site</button>
            </div>
            <p class="status-line" id="overviewActionStatus"></p>
          </div>

          <div class="card">
            <div class="card-title">Readiness</div>
            <p class="status-line">${escapeHtml(readiness.headline || "")}</p>
            <div class="readiness-checks">${checks}</div>
          </div>

          ${scorecardCard}

          ${

              : ""
          }

        document.getElementById("runValidationButton").addEventListener("click", () =>
          runValidation(site.site_name)

        document.getElementById("deleteSiteButton").addEventListener("click", () =>
          deleteSite(site.site_name)

      function kv(label, value) {
        return `
          <div class="kv">
            <div class="kv-label">${escapeHtml(label)}</div>
            <div class="kv-value">${value === undefined || value === null ? "Not available" : escapeHtml(String(value))}</div>
          </div>
        `;
      }

      function comparisonBadge(status) {
        const tags = {
          agree: ["Agree", "ok"],
          disagree: ["Disagree", "missing"],
          cannot_compare: ["Cannot compare", "warn"],
        };
        const [label, cls] = Object.hasOwn(tags, status) ? tags[status] : ["Status unavailable", "plain"];
        return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
      }

      async function runValidation(siteName) {
        const button = document.getElementById("runValidationButton");
        const status = document.getElementById("overviewActionStatus");
        button.disabled = true;
        status.className = "status-line";
        status.textContent = "Running local validation… this can take a moment.";
        try {
          const response = await fetch("/api/run-validation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ folder_name: siteName }),
          });
          const result = await response.json();
          status.className = `status-line ${response.ok ? "success" : "error"}`;
          status.textContent = result.message || (response.ok ? "Done." : "Validation failed.");
          if (response.ok) {
            await bootstrap();
          }
        } catch (error) {
          status.className = "status-line error";
          status.textContent = `Could not run validation: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      }

      async function deleteSite(siteName) {
        const confirmed = confirm(
          `Delete this site and all of its local videos, labels, manifests, outputs, and runs?\n\nSite: ${siteName}`
        );
        if (!confirmed) return;
        const button = document.getElementById("deleteSiteButton");
        const status = document.getElementById("overviewActionStatus");
        button.disabled = true;
        try {
          const response = await fetch("/api/delete-site", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ folder_name: siteName }),
          });
          const result = await response.json();
          if (!response.ok) {
            status.className = "status-line error";
            status.textContent = result.message || "Could not delete this site.";
            button.disabled = false;
            return;
          }
          window.location.href = "/openfloodai-home-ui.html";
        } catch (error) {
          status.className = "status-line error";
          status.textContent = `Could not delete this site: ${error.message}`;
          button.disabled = false;
        }
      }

      // ---------------------------------------------------------------
      // Videos tab
      // ---------------------------------------------------------------
      function renderVideosTab(site) {
        const panel = document.getElementById("panel-videos");
        const videoIds = site.video_ids || [];
        if (!videoIds.length) {
          panel.innerHTML = `
            <div class="card">
              <div class="empty-state">
                <div class="empty-state-icon">&#127909;</div>
                No videos have been added to this site yet.
              </div>
            </div>
          `;
          return;
        }
        const labeledVideoIds = new Set(site.labeled_video_ids || []);
        const cards = videoIds
          .map((videoId) => {
            const manifestRow = manifestByVideoId[videoId] || {};
            const hasLabel = labeledVideoIds.has(videoId);
            const chips = [
              manifestRow.purpose ? `<span class="chip">${escapeHtml(manifestRow.purpose)}</span>` : "",
              manifestRow.split ? `<span class="chip">${escapeHtml(manifestRow.split)}</span>` : "",
              manifestRow.hard_case_type
                ? `<span class="chip">${escapeHtml(manifestRow.hard_case_type)}</span>`
                : "",
            ]
              .filter(Boolean)
              .join("");
            return `

                <div class="video-card-body">

                    <span class="badge ${hasLabel ? "ok" : "warn"}">${hasLabel ? "Has a label" : "No label yet"}</span>
                    ${chips}
                  </div>
                  ${manifestRow.notes ? `<div class="video-note">${escapeHtml(manifestRow.notes)}</div>` : ""}
                  <div class="video-card-meta" data-duration>Duration: loading&hellip;</div>
                  <div>
                    <button class="btn small" data-preview-toggle>Preview</button>
                  </div>
                  <div class="video-preview-wrap" data-preview-wrap></div>
                </div>
              </div>
            `;
          })
          .join("");
        panel.innerHTML = `
          <div class="card">
            <div class="card-title">Input videos <span class="badge neutral">${videoIds.length}</span></div>
            <div class="card-grid">${cards}</div>
          </div>
        `;
        for (const videoId of videoIds) {
          loadVideoDuration(site.site_name, videoId);
        }
        for (const card of panel.querySelectorAll(".video-card")) {
          const toggle = card.querySelector("[data-preview-toggle]");
          toggle.addEventListener("click", () => toggleVideoPreview(card, site.site_name));
        }
      }

      async function loadVideoDuration(siteName, videoId) {
        const card = document.querySelector(`.video-card[data-video-id="${cssEscape(videoId)}"]`);
        if (!card) return;
        const meta = card.querySelector("[data-duration]");
        try {
          const response = await fetch(
            `/api/video-duration?${new URLSearchParams({ folder_name: siteName, video_id: videoId })}`
          );
          const result = await response.json();
          if (!response.ok || typeof result.duration_seconds !== "number") {
            meta.textContent = "Duration: unavailable";
            return;
          }
          meta.textContent = `Duration: ${result.duration_seconds.toFixed(1)}s`;
        } catch (error) {
          meta.textContent = "Duration: unavailable";
        }
      }

      function cssEscape(value) {
        return String(value).replace(/["\\]/g, "\\$&");
      }

      function toggleVideoPreview(card, siteName) {
        const wrap = card.querySelector("[data-preview-wrap]");
        const button = card.querySelector("[data-preview-toggle]");
        const isOpen = wrap.classList.contains("open");
        if (isOpen) {
          wrap.classList.remove("open");
          wrap.innerHTML = "";
          button.textContent = "Preview";
          return;
        }
        const videoId = card.dataset.videoId;
        const query = new URLSearchParams({ folder_name: siteName, video_id: videoId });
        wrap.innerHTML = `<video controls preload="metadata" src="/api/site-video?${query}"></video>`;
        wrap.classList.add("open");
        button.textContent = "Hide preview";
      }

      // ---------------------------------------------------------------
      // Image sequences tab
      // ---------------------------------------------------------------
      async function renderImageSequencesTab(site) {
        const panel = document.getElementById("panel-image-sequences");
        panel.innerHTML = `
          <div class="card">
            <div class="card-title">USGS image sequences</div>
            <p class="status-line">Loading&hellip;</p>
          </div>
        `;

        try {
          const response = await fetch(
            `/api/site-image-sequences?${new URLSearchParams({ folder_name: site.site_name })}`

            const payload = await response.json();
            sequences = payload.sequences || [];
          }
        } catch (error) {
          sequences = [];
        }

        if (!sequences.length) {
          panel.innerHTML = `
            <div class="card">
              <div class="card-title">USGS image sequences</div>
              <div class="empty-state">
                <div class="empty-state-icon">&#128247;</div>
                No image sequences have been downloaded for this site yet. Start one from
                the Home UI's guided workflow.
              </div>
            </div>
          `;
          return;
        }

        const cards = sequences
          .map((sequence) => renderImageSequenceCard(site.site_name, sequence))
          .join("");

          <div class="card">
            <div class="card-title">
              USGS image sequences <span class="badge neutral">${sequences.length}</span>
            </div>
            <p class="status-line">
              Timestamped observation images for future image validation. These do not
              affect video intake, labels, the manifest, or Run validation.
            </p>
            <div class="card-grid">${cards}</div>
          </div>

        for (const card of panel.querySelectorAll(".video-card[data-sequence-id]")) {

          loadImageSequenceRuns(site.site_name, sequenceId, card);

      function renderImageSequenceCard(siteName, sequence) {
        const records = Array.isArray(sequence.records) ? sequence.records : [];
        const downloaded = records.filter((record) => record.download_status === "downloaded");
        const thumbnails = downloaded
          .slice(0, 12)
          .map((record) => {
            const query = new URLSearchParams({
              folder_name: siteName,
              sequence_id: sequence.sequence_id,
              filename: record.filename,
            });
            const watchedAreaQuery = new URLSearchParams({
              site: siteName,
              action: "set_watched_area",
              image_sequence_id: sequence.sequence_id,
              image_filename: record.filename,
            });
            const riverbankQuery = new URLSearchParams({
              site: siteName,
              action: "set_normal_waterline_guide",
              image_sequence_id: sequence.sequence_id,
              image_filename: record.filename,
            });
            return `
              <div class="image-sequence-thumb">
                <img src="/api/image-sequence-image?${query}" alt="${escapeHtml(record.captured_at_utc || record.filename)}" loading="lazy">
                <div class="video-card-meta">${escapeHtml(formatDateTime(record.local_time || record.captured_at_utc))}</div>
                <a class="btn small" href="/openfloodai-home-ui.html?${watchedAreaQuery}">Use as watched-area reference</a>
                <a class="btn small" href="/openfloodai-home-ui.html?${riverbankQuery}">Use as riverbank reference</a>
              </div>
            `;
          })
          .join("");
        return `
          <div class="video-card" data-sequence-id="${escapeHtml(sequence.sequence_id || "")}">
            <div class="video-card-head">
              <div class="video-card-id">${escapeHtml(sequence.sequence_id || "")}</div>
              <div class="video-card-filename">${escapeHtml(sequence.sampling_mode || "")}</div>
            </div>
            <div class="video-card-body">
              <div class="chip-row">
                <span class="badge ok">${sequence.downloaded_count || 0} downloaded</span>
                ${sequence.missing_count ? `<span class="badge warn">${sequence.missing_count} missing</span>` : ""}
                ${sequence.failed_count ? `<span class="badge missing">${sequence.failed_count} failed</span>` : ""}
              </div>
              <div class="video-card-meta">
                ${escapeHtml(sequence.requested_start_date || "")} to
                ${escapeHtml(sequence.requested_end_date || "")} (${escapeHtml(sequence.timezone || "UTC")})
              </div>
              <div class="image-sequence-thumb-grid">${thumbnails || "<p class=\"status-line\">No images downloaded yet.</p>"}</div>
              <div style="margin-top: 12px;">
                <label style="display: block; font-weight: 700; margin-bottom: 4px; font-size: 12.5px;">
                  Baseline image
                </label>
                <select data-baseline-select style="width: 100%; max-width: 320px; padding: 6px; border: 1px solid var(--line); border-radius: 4px;">
                  <option value="">Auto (earliest downloaded image)</option>
                  ${downloaded
                    .map(
                      (record) =>
                        `<option value="${escapeHtml(record.filename)}">${escapeHtml(formatDateTime(record.local_time || record.captured_at_utc))} &mdash; ${escapeHtml(record.filename)}</option>`
                    )
                    .join("")}
                </select>
              </div>
              <div style="margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <button type="button" class="btn small" data-run-image-sequence-validation>Run image-sequence validation</button>
                <span class="status-line" data-image-sequence-run-status></span>
              </div>
              <div data-image-sequence-run-list style="margin-top: 10px;">
                <p class="status-line">Loading past runs&hellip;</p>
              </div>
            </div>
          </div>
        `;
      }

      // ---------------------------------------------------------------
      // Image-sequence validation runs (issue #182) — a separate, parallel
      // flow from the video Runs tab above: own state, own endpoints, own
      // output folder (outputs/image-sequence-runs/). Never touches
      // panel-runs, runDetailCache, or selectedRunIds.
      // ---------------------------------------------------------------
      const runningImageSequenceValidations = new Set();
      const imageSequenceRunDetailDataCache = new Map();

      async function runImageSequenceValidationForSite(siteName, sequenceId, button, card) {
        const key = `${siteName}::${sequenceId}`;
        if (runningImageSequenceValidations.has(key)) return;
        runningImageSequenceValidations.add(key);
        const statusEl = card.querySelector("[data-image-sequence-run-status]");
        const originalText = button.textContent;
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        button.textContent = "Running…";
        const baselineSelect = card.querySelector("[data-baseline-select]");
        const baselineFilename = baselineSelect ? baselineSelect.value : "";
        try {
          const response = await fetch("/api/run-image-sequence-validation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              folder_name: siteName,
              sequence_id: sequenceId,
              ...(baselineFilename ? { baseline_filename: baselineFilename } : {}),
            }),
          });
          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.message || `Request failed: ${response.status}`);
          }
          const counts = result.counts || {};
          statusEl.textContent =
            `Done: ${fallback(counts.possible_water_level_change, 0)} possible change, ` +
            `${fallback(counts.no_water_level_change, 0)} no change, ` +
            `${fallback(counts.cannot_judge_water_level, 0)} cannot judge, ` +
            `${fallback(counts.camera_or_image_problem, 0)} camera/image problem.`;
          await loadImageSequenceRuns(siteName, sequenceId, card);
        } catch (error) {
          statusEl.textContent = `Failed: ${error.message}`;
        } finally {
          button.disabled = false;
          button.removeAttribute("aria-busy");
          button.textContent = originalText;
          runningImageSequenceValidations.delete(key);
        }
      }

      async function loadImageSequenceRuns(siteName, sequenceId, card) {
        const list = card.querySelector("[data-image-sequence-run-list]");
        try {
          const response = await fetch(
            `/api/image-sequence-runs?${new URLSearchParams({ folder_name: siteName, sequence_id: sequenceId })}`
          );
          if (!response.ok) throw new Error("Request failed");
          const payload = await response.json();
          renderImageSequenceRunList(list, siteName, payload.runs || []);
        } catch (error) {
          list.innerHTML = '<p class="status-line error">Could not load past runs.</p>';
        }
      }

      function renderImageSequenceRunList(list, siteName, runs) {
        if (!runs.length) {
          list.innerHTML = '<p class="status-line">No image-sequence validation runs yet.</p>';
          return;
        }
        list.innerHTML = runs
          .map(
            (run, index) => `
              <div class="run-card" data-run-index="${index}" data-run-id="${escapeHtml(run.run_id || "")}">
                <div class="run-card-head" data-run-head>
                  <div class="run-head-main">
                    <div class="run-id">${escapeHtml(run.run_id || "Unknown run")}</div>
                    <div class="run-time">
                      ${escapeHtml(formatDateTime(run.created_at))} &middot;
                      baseline ${escapeHtml(run.baseline_filename || "unknown")}
                    </div>
                  </div>
                  <div class="run-counts">
                    <span class="badge ok">${fallback(run.possible_water_level_change_count, 0)} possible</span>
                    <span class="badge neutral">${fallback(run.no_water_level_change_count, 0)} no change</span>
                    <span class="badge warn">${fallback(run.cannot_judge_water_level_count, 0)} cannot judge</span>
                    <span class="badge missing">${fallback(run.camera_or_image_problem_count, 0)} problem</span>
                  </div>
                  <span class="run-caret">&#9654;</span>
                </div>
                <div class="run-card-body" data-run-body>
                  <div class="loading-line">Loading run details&hellip;</div>
                </div>
              </div>
            `
          )
          .join("");
        list.querySelectorAll("[data-run-head]").forEach((head) => {
          head.addEventListener("click", () => {
            const card = head.closest(".run-card");
            const willOpen = !card.classList.contains("open");
            card.classList.toggle("open");
            if (willOpen) {
              loadImageSequenceRunBody(card, siteName, card.dataset.runId);
            }
          });
        });
      }

      async function loadImageSequenceRunBody(card, siteName, runId) {
        const body = card.querySelector("[data-run-body]");
        const cacheKey = `${siteName}::${runId}`;
        if (imageSequenceRunDetailDataCache.has(cacheKey)) {
          mountImageSequenceDetailView(body, siteName, runId, imageSequenceRunDetailDataCache.get(cacheKey));
          return;
        }
        try {
          const response = await fetch(
            `/api/image-sequence-run-detail?${new URLSearchParams({ folder_name: siteName, run_id: runId })}`
          );
          if (!response.ok) throw new Error("Request failed");
          const detail = await response.json();
          imageSequenceRunDetailDataCache.set(cacheKey, detail);
          mountImageSequenceDetailView(body, siteName, runId, detail);
        } catch (error) {
          body.innerHTML = `<p class="status-line error">Could not load this run: ${escapeHtml(error.message)}</p>`;
        }
      }

      // ---------------------------------------------------------------
      // Image-sequence run detail: timeline chart, gage correlation,
      // event review. Ports the approved review-UI design (issue #152) onto
      // real records/gauge_series/event_reviews from the API instead of
      // mock data. See docs/research/colorado-river-pilot-tracker.md.
      // ---------------------------------------------------------------
      const RESULT_CODE = {
        possible_water_level_change: "P",
        no_water_level_change: "N",
        cannot_judge_water_level: "U",
        camera_or_image_problem: "C",
      };
      const CODE_COLOR = { N: "#98a2b3", P: "#9a5b13", C: "#9b1c31", U: "#1769aa" };
      const CODE_BADGE_BG = { P: "#fff6df", C: "#fff0f3", U: "#e9f4fb" };
      const CODE_LABEL = {
        N: "No water level change",
        P: "Possible water level change",
        C: "Camera or image problem",
        U: "Cannot judge",
        M: "No image available",
      };
      const GRANULARITIES = ["hourly", "daily", "weekly", "monthly", "yearly"];
      const GRANULARITY_LABEL = {
        hourly: "Hourly",
        daily: "Daily",
        weekly: "Weekly",
        monthly: "Monthly",
        yearly: "Yearly",
      };

      function isoImageSequenceMean(values) {
        return values.reduce((sum, value) => sum + value, 0) / values.length;
      }

      function buildImageSequenceDays(records) {
        return (records || [])
          .map((record) => {
            const isGap = record.download_status !== "downloaded";
            const code = isGap ? "M" : RESULT_CODE[record.result] || "N";
            const capturedAtUtc = String(record.captured_at_utc || "");
            const localTime = String(record.local_time || capturedAtUtc);
            return {
              date: capturedAtUtc.slice(0, 10),
              time: localTime.length >= 16 ? localTime.slice(11, 16) : localTime,
              score: typeof record.region_change_score === "number" ? record.region_change_score : null,
              code,
              filename: record.filename || "",
              reason: record.reason || "",
              resultLabel: CODE_LABEL[code] || record.result || "",
            };
          })
          .filter((day) => day.date)
          .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      }

      function buildGaugeByDate(gaugeSeries) {
        const map = new Map();
        (gaugeSeries || []).forEach((row) => {
          if (row && row.date && typeof row.gauge_value === "number") map.set(row.date, row.gauge_value);
        });
        return map;
      }

      function findImageSequenceChangeStart(days) {
        const scores = days.map((day) => day.score);
        const base = scores.slice(0, 15).filter((value) => value != null);
        if (base.length < 3) return { index: -1, threshold: null, baselineMean: null };
        const meanValue = isoImageSequenceMean(base);
        const variance = isoImageSequenceMean(base.map((value) => (value - meanValue) ** 2));
        const threshold = meanValue + 2 * Math.sqrt(variance);
        for (let i = 0; i < scores.length - 2; i++) {
          if (scores[i] > threshold && scores[i + 1] > threshold && scores[i + 2] > threshold) {
            return { index: i, threshold, baselineMean: meanValue };
          }
        }
        return { index: -1, threshold, baselineMean: meanValue };
      }

      function buildImageSequenceEvents(days) {
        const events = [];
        let i = 0;
        while (i < days.length) {
          let j = i;
          while (j + 1 < days.length && days[j + 1].code === days[i].code) j++;
          if (days[i].code !== "N" && days[i].code !== "M") {
            let peak = i;
            for (let k = i; k <= j; k++) {
              if ((days[k].score ?? -Infinity) > (days[peak].score ?? -Infinity)) peak = k;
            }
            events.push({
              start: i,
              end: j,
              peak,
              code: days[i].code,
              key: `${days[i].date}-${days[j].date}-${days[i].code}`,
            });
          }
          i = j + 1;
        }
        return events;
      }

      function isoWeekStart(dateStr) {
        const parsed = new Date(dateStr + "T00:00:00Z");
        const day = parsed.getUTCDay();
        parsed.setUTCDate(parsed.getUTCDate() + (day === 0 ? -6 : 1 - day));
        return parsed.toISOString().slice(0, 10);
      }

      function imageSequenceBucketKey(dateStr, granularity) {
        if (granularity === "weekly") return isoWeekStart(dateStr);
        if (granularity === "monthly") return dateStr.slice(0, 7);
        if (granularity === "yearly") return dateStr.slice(0, 4);
        return dateStr;
      }

      function buildImageSequenceBuckets(days, granularity) {
        const map = new Map();
        days.forEach((day, index) => {
          const key = imageSequenceBucketKey(day.date, granularity);
          if (!map.has(key)) map.set(key, { key, indices: [] });
          map.get(key).indices.push(index);
        });
        return Array.from(map.values());
      }

      function summarizeImageSequenceBucket(bucket, days, gaugeByDate) {
        const codes = bucket.indices.map((i) => days[i].code);
        const validScoreIdx = bucket.indices.filter((i) => days[i].score != null);
        const meanScore = validScoreIdx.length ? isoImageSequenceMean(validScoreIdx.map((i) => days[i].score)) : null;
        const gaugeValues = bucket.indices.map((i) => gaugeByDate.get(days[i].date)).filter((v) => v != null);
        const meanGauge = gaugeValues.length ? isoImageSequenceMean(gaugeValues) : null;
        const hasPossible = codes.some((code) => code === "P" || code === "U");
        const hasCamera = codes.some((code) => code === "C");
        const dominant = hasPossible ? "P" : hasCamera ? "C" : "N";
        let repIndex = bucket.indices[0];
        if (hasPossible) repIndex = bucket.indices.find((i) => days[i].code === "P" || days[i].code === "U");
        else if (hasCamera) repIndex = bucket.indices.find((i) => days[i].code === "C");
        return {
          dateForTick: days[bucket.indices[0]].date,
          meanScore,
          meanGauge,
          color: CODE_COLOR[dominant],
          dayCount: bucket.indices.length,
          possibleCount: codes.filter((code) => code === "P" || code === "U").length,
          cameraCount: codes.filter((code) => code === "C").length,
          gapCount: codes.filter((code) => code === "M").length,
          repIndex,
        };
      }

      function mountImageSequenceDetailView(container, siteName, runId, detail) {
        const summary = detail.summary || {};
        const days = buildImageSequenceDays(detail.records);
        const gaugeByDate = buildGaugeByDate(detail.gauge_series);
        const events = buildImageSequenceEvents(days);
        const changeInfo = findImageSequenceChangeStart(days);

        const state = {
          selectedIndex: changeInfo.index >= 0 ? changeInfo.index : 0,
          eventCursor: -1,
          categoryFilter: null,
          granularity: "daily",
          reviewStatus: Object.assign({}, detail.event_reviews || {}),
          hideReviewedSignal: false,
          hideReviewedQuality: false,
          pendingKey: null,
          errorText: "",
        };

        async function setEventReview(eventKey, status) {
          state.pendingKey = eventKey;
          render();
          try {
            const response = await fetch("/api/set-image-sequence-event-review", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                folder_name: siteName,
                sequence_id: summary.sequence_id,
                event_key: eventKey,
                status,
              }),
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) throw new Error(payload.message || "Request failed.");
            state.reviewStatus = payload.event_reviews || {};
            state.errorText = "";
          } catch (error) {
            state.errorText = `Could not save that review: ${error.message}`;
          } finally {
            state.pendingKey = null;
            render();
          }
        }

        container.addEventListener("click", (event) => {
          const target = event.target.closest("[data-act]");
          if (!target || !container.contains(target)) return;
          const act = target.dataset.act;
          if (act === "select") {
            state.selectedIndex = Number(target.dataset.index);
            state.eventCursor = -1;
            render();
          } else if (act === "filter") {
            const code = target.dataset.code;
            state.categoryFilter = state.categoryFilter === code ? null : code;
            render();
          } else if (act === "granularity") {
            if (target.dataset.value === "hourly") return;
            state.granularity = target.dataset.value;
            render();
          } else if (act === "toggle-hide-signal") {
            state.hideReviewedSignal = !state.hideReviewedSignal;
            render();
          } else if (act === "toggle-hide-quality") {
            state.hideReviewedQuality = !state.hideReviewedQuality;
            render();
          } else if (act === "review") {
            setEventReview(target.dataset.key, target.dataset.status || null);
          } else if (act === "prev-event" || act === "next-event") {
            if (!events.length) return;
            const delta = act === "prev-event" ? -1 : 1;
            const next = (state.eventCursor + delta + events.length) % events.length;
            state.eventCursor = next;
            state.selectedIndex = events[next].peak;
            render();
          }
        });

        function render() {
          container.innerHTML = renderImageSequenceDetail({
            siteName,
            runId,
            summary,
            days,
            gaugeByDate,
            events,
            changeInfo,
            state,
          });
        }

        render();
      }

      function renderImageSequenceDetail({ siteName, runId, summary, days, gaugeByDate, events, changeInfo, state }) {
        const n = days.length;
        if (n === 0) {
          return '<p class="status-line">No compared images in this run yet.</p>';
        }

        const granularity = state.granularity;
        const rawBuckets = buildImageSequenceBuckets(days, granularity);
        const buckets = rawBuckets.map((bucket) => summarizeImageSequenceBucket(bucket, days, gaugeByDate));
        const bn = buckets.length;
        const chartW = 1040;
        const leftPad = 34;
        const usableW = chartW - leftPad;
        const xAt = (index) => (bn <= 1 ? leftPad + usableW / 2 : leftPad + (index / (bn - 1)) * usableW);
        buckets.forEach((bucket, index) => {
          bucket.x = Math.round(xAt(index) * 10) / 10;
        });

        const validScores = buckets.map((bucket) => bucket.meanScore).filter((value) => value != null);
        const scoreMax = validScores.length ? Math.ceil(Math.max(...validScores) * 100) / 100 + 0.02 : 0.1;
        const scoreH = 178;
        const scoreY = (value) => 4 + scoreH - (Math.max(0, value) / scoreMax) * scoreH;

        const gaugeValues = buckets.map((bucket) => bucket.meanGauge).filter((value) => value != null);
        const hasGaugeData = gaugeValues.length > 0;
        const gaugeMin = hasGaugeData ? Math.floor(Math.min(...gaugeValues) * 10) / 10 - 0.1 : 0;
        const gaugeMax = hasGaugeData ? Math.ceil(Math.max(...gaugeValues) * 10) / 10 + 0.1 : 1;
        const gaugeH = 118;
        const gaugeY = (value) => 4 + gaugeH - ((value - gaugeMin) / (gaugeMax - gaugeMin || 1)) * gaugeH;

        const filter = state.categoryFilter;
        const points = buckets
          .filter((bucket) => bucket.meanScore != null)
          .map((bucket) => {
            const dominantCode = bucket.possibleCount > 0 ? "P" : bucket.cameraCount > 0 ? "C" : "N";
            const dimmed = filter && !(dominantCode === filter || (filter === "U" && bucket.possibleCount > 0));
            const selected = bucket.repIndex === state.selectedIndex;
            return {
              x: bucket.x,
              y: Math.round(scoreY(bucket.meanScore) * 10) / 10,
              color: bucket.color,
              radius: granularity === "daily" ? (selected ? 5 : 3) : Math.min(9, 4 + bucket.dayCount / 4),
              ring: selected ? 2 : 1,
              opacity: dimmed ? 0.12 : 1,
              index: bucket.repIndex,
            };
          });

        const scoreSegments = [];
        let currentSeg = [];
        buckets.forEach((bucket) => {
          if (bucket.meanScore == null) {
            if (currentSeg.length) {
              scoreSegments.push(currentSeg.join(" "));
              currentSeg = [];
            }
          } else {
            currentSeg.push(`${bucket.x},${Math.round(scoreY(bucket.meanScore) * 10) / 10}`);
          }
        });
        if (currentSeg.length) scoreSegments.push(currentSeg.join(" "));

        const gaugeLinePoints = hasGaugeData
          ? buckets
              .filter((bucket) => bucket.meanGauge != null)
              .map((bucket) => `${bucket.x},${Math.round(gaugeY(bucket.meanGauge) * 10) / 10}`)
              .join(" ")
          : "";

        const gapMarkers =
          granularity === "daily"
            ? buckets.filter((bucket) => bucket.gapCount > 0 && bucket.meanScore == null)
            : [];

        const monthTicks = [];
        let lastTick = "";
        buckets.forEach((bucket) => {
          const tickKey = granularity === "yearly" ? bucket.dateForTick.slice(0, 4) : bucket.dateForTick.slice(0, 7);
          if (tickKey !== lastTick) {
            monthTicks.push({ x: Math.round(bucket.x), label: bucket.dateForTick.slice(granularity === "yearly" ? 0 : 5, granularity === "yearly" ? 4 : 7) });
            lastTick = tickKey;
          }
        });

        const changeBucketIdx = rawBuckets.findIndex((bucket) => bucket.indices.includes(changeInfo.index));
        const changeX = changeInfo.index >= 0 && changeBucketIdx >= 0 ? buckets[changeBucketIdx].x : -10;
        const thresholdY = changeInfo.threshold != null ? Math.round(scoreY(changeInfo.threshold) * 10) / 10 : -10;
        const bandBottomY = 182;

        const counts = { N: 0, P: 0, C: 0, U: 0, M: 0 };
        days.forEach((day) => {
          counts[day.code]++;
        });

        function reviewButtons(ev, kind) {
          const status = state.reviewStatus[ev.key];
          const pending = state.pendingKey === ev.key;
          if (status) {
            const label = status === "confirmed_real" ? "Confirmed real change" : status === "not_real" ? "Not a real change" : "Acknowledged";
            return `
              <span style="font-size: 12px; font-weight: 700; color: ${status === "confirmed_real" ? "var(--ok)" : "var(--muted)"}; white-space: nowrap;">&check; ${escapeHtml(label)}</span>
              <button type="button" class="btn small" data-act="review" data-key="${escapeHtml(ev.key)}" data-status="" ${pending ? "disabled" : ""}>Undo</button>
            `;
          }
          if (kind === "quality") {
            return `<button type="button" class="btn small" data-act="review" data-key="${escapeHtml(ev.key)}" data-status="acknowledged" ${pending ? "disabled" : ""}>${pending ? "Saving…" : "Acknowledge"}</button>`;
          }
          return `
            <button type="button" class="btn small" data-act="review" data-key="${escapeHtml(ev.key)}" data-status="confirmed_real" ${pending ? "disabled" : ""}>${pending ? "Saving…" : "Confirm real"}</button>
            <button type="button" class="btn small" data-act="review" data-key="${escapeHtml(ev.key)}" data-status="not_real" ${pending ? "disabled" : ""}>Not real</button>
          `;
        }

        function eventRow(ev, kind) {
          const startDay = days[ev.start];
          const endDay = days[ev.end];
          const dayCount = ev.end - ev.start + 1;
          const rangeLabel = ev.start === ev.end ? startDay.date : `${startDay.date} to ${endDay.date}`;
          const reason = days[ev.peak].reason || CODE_LABEL[ev.code];
          const dimmedByFilter = filter && ev.code !== filter;
          const reviewed = Boolean(state.reviewStatus[ev.key]);
          if (reviewed && (kind === "signal" ? state.hideReviewedSignal : state.hideReviewedQuality)) return "";
          return `
            <div class="ev-row" style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--soft-line); opacity: ${dimmedByFilter ? 0.3 : reviewed ? 0.6 : 1};">
              <span style="width: 9px; height: 9px; border-radius: 50%; background: ${CODE_COLOR[ev.code]}; flex-shrink: 0;"></span>
              <div data-act="select" data-index="${ev.peak}" style="flex-grow: 1; min-width: 0; cursor: pointer;">
                <div style="font-size: 13px; font-weight: 700;">${escapeHtml(rangeLabel)}</div>
                <div style="font-size: 12px; color: var(--muted);">${escapeHtml(reason)}</div>
              </div>
              <span class="badge plain" style="background: ${CODE_BADGE_BG[ev.code]}; flex-shrink: 0;">${dayCount} day${dayCount === 1 ? "" : "s"}</span>
              <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">${reviewButtons(ev, kind)}</div>
            </div>
          `;
        }

        const signalEvents = events.filter((ev) => ev.code === "P" || ev.code === "U");
        const qualityEvents = events.filter((ev) => ev.code === "C");
        const signalReviewedCount = signalEvents.filter((ev) => state.reviewStatus[ev.key]).length;
        const qualityReviewedCount = qualityEvents.filter((ev) => state.reviewStatus[ev.key]).length;
        const signalRows = signalEvents.map((ev) => eventRow(ev, "signal")).join("");
        const qualityRows = qualityEvents.map((ev) => eventRow(ev, "quality")).join("");

        const sel = days[state.selectedIndex];
        const selGauge = gaugeByDate.get(sel.date);
        const changeStartDay = changeInfo.index >= 0 ? days[changeInfo.index] : null;

        const gaugeDates = Array.from(gaugeByDate.keys());
        const gaugeStart = gaugeDates.length ? gaugeByDate.get(gaugeDates[0]) : null;
        const gaugeEnd = gaugeDates.length ? gaugeByDate.get(gaugeDates[gaugeDates.length - 1]) : null;

        // image-sequence-comparison-overlay.png already places the baseline
        // and biggest-change frames side by side with the watched area
        // marked, so it alone is the "biggest change" picture — showing the
        // baseline/changed frames again next to it would just repeat it.
        const comparisonQuery = summary.biggest_change_filename
          ? new URLSearchParams({
              folder_name: siteName,
              run_id: runId,
              filename: "image-sequence-comparison-overlay.png",
            })
          : null;

        // The currently selected day's own raw image, real and re-fetched
        // on every selection (chart point, event row, Previous/Next event)
        // — distinct from the fixed "biggest change" picture above, which
        // never changes regardless of what is selected.
        const baselineImageQuery = summary.baseline_filename
          ? new URLSearchParams({
              folder_name: siteName,
              sequence_id: summary.sequence_id,
              filename: summary.baseline_filename,
            })
          : null;
        // A coverage-gap day (missing or failed download) has a filename
        // recorded in the manifest but no actual image file on disk —
        // fetching it would just 404, so treat it the same as "no image".
        const selectedImageQuery = sel.filename && sel.code !== "M"
          ? new URLSearchParams({
              folder_name: siteName,
              sequence_id: summary.sequence_id,
              filename: sel.filename,
            })
          : null;

        const changeSummaryHtml = changeStartDay
          ? `From the first days on record the region held steady around ${changeInfo.baselineMean.toFixed(3)}. Starting ${escapeHtml(changeStartDay.date)}, the day-to-day score stayed above ${changeInfo.threshold.toFixed(3)} for three days running. That is the actual turning point &mdash; not any single flagged day.`
          : "Not enough same-camera history yet to say when (or whether) a sustained shift started.";

        const gaugeCorrelationHtml = hasGaugeData && gaugeStart != null && gaugeEnd != null
          ? `Gage height went from ${gaugeStart.toFixed(2)} to ${gaugeEnd.toFixed(2)} over this period. Compare that against the change-score trend below to see whether a flagged period lines up with an actual water-level move.`
          : "No gage data is available to correlate for this sequence yet.";

        return `
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px;">
            ${["P", "C", "N", "U"].map((code) => `
              <div data-act="filter" data-code="${code}" style="cursor: pointer; padding: 10px 12px; border-radius: 8px; background: ${code === "N" || code === "U" ? "var(--panel-2)" : CODE_BADGE_BG[code]}; outline: ${filter === code ? "2px solid var(--ink)" : "none"};">
                <div style="font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;">${escapeHtml(CODE_LABEL[code])}</div>
                <div style="font-size: 20px; font-weight: 800;">${counts[code]}</div>
              </div>
            `).join("")}
          </div>
          <p class="status-line" style="margin-bottom: 14px;">${filter ? `Showing only "${escapeHtml(CODE_LABEL[filter])}" on the chart and in the lists below. Click the card again to show everything.` : "Click a card above to isolate just that result on the chart and in the lists below."}</p>

          <div class="kv-grid" style="background: var(--panel-2); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;">
            <div class="kv"><div class="kv-label">When did it start</div><div class="kv-value">${changeSummaryHtml}</div></div>
            <div class="kv"><div class="kv-label">Gage correlation</div><div class="kv-value">${gaugeCorrelationHtml}</div></div>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
            <span style="font-size: 12px; color: var(--muted); font-weight: 700;">View by:</span>
            ${GRANULARITIES.map((g) => `
              <button type="button" data-act="granularity" data-value="${g}" ${g === "hourly" ? "disabled title=\"This sampling mode captures one image per day; there is no hourly resolution yet.\"" : ""} class="btn small" style="${g === granularity ? "background: var(--ink); color: #fff; border-color: var(--ink);" : ""}">${GRANULARITY_LABEL[g]}</button>
            `).join("")}
          </div>

          ${hasGaugeData ? `
          <div class="kv" style="margin-bottom: 6px;">
            <div class="kv-label">Gage height, ${granularity === "daily" ? "every day" : `by ${granularity.replace("ly", "")}`}</div>
          </div>
          <svg viewBox="0 0 1040 130" style="width: 100%; display: block; margin-bottom: 4px;">
            <text x="4" y="10" font-size="10" fill="var(--faint)">${gaugeMax.toFixed(1)}</text>
            <line x1="50" y1="10" x2="1040" y2="10" stroke="var(--soft-line)" stroke-width="1" />
            <text x="4" y="70" font-size="10" fill="var(--faint)">${((gaugeMax + gaugeMin) / 2).toFixed(1)}</text>
            <line x1="50" y1="66" x2="1040" y2="66" stroke="var(--soft-line)" stroke-width="1" />
            <text x="4" y="130" font-size="10" fill="var(--faint)">${gaugeMin.toFixed(1)}</text>
            <line x1="50" y1="122" x2="1040" y2="122" stroke="var(--soft-line)" stroke-width="1" />
            ${changeX > 0 ? `<line x1="${changeX}" y1="4" x2="${changeX}" y2="122" stroke="#9a5b13" stroke-width="1.5" stroke-dasharray="2,3" />` : ""}
            <polyline points="${gaugeLinePoints}" fill="none" stroke="#1769aa" stroke-width="2" />
          </svg>
          ` : '<p class="status-line" style="margin-bottom:10px;">No gage data available to chart for this sequence.</p>'}

          <div class="kv" style="margin-bottom: 6px;">
            <div class="kv-label">Region change score, ${granularity === "daily" ? "every day" : `by ${granularity.replace("ly", "")}`}</div>
          </div>
          <div class="status-line" style="background: var(--panel-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;">
            <strong>${escapeHtml(sel.date)}, ${escapeHtml(sel.time)} local</strong> &middot;
            change score ${sel.score == null ? "no image, not compared" : sel.score.toFixed(4)}
            ${selGauge != null ? ` &middot; gage height ${selGauge.toFixed(2)}` : ""}
            &middot; <span style="color: ${CODE_COLOR[sel.code]}; font-weight: 700;">${escapeHtml(sel.resultLabel)}</span>
          </div>
          <svg viewBox="0 0 1040 200" style="width: 100%; display: block;">
            ${thresholdY >= 0 ? `<rect x="30" y="${thresholdY}" width="1010" height="${Math.max(0, bandBottomY - thresholdY)}" fill="var(--accent-bg)" opacity="0.6" />` : ""}

            <span style="display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:50%;background:${CODE_COLOR.P};display:inline-block;"></span>Needs a look</span>

          </div>

          <div class="card-grid" style="margin-top: 18px;">
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
                <strong>Worth reviewing (${signalEvents.length})</strong>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:12px;color:var(--muted);">${signalReviewedCount} of ${signalEvents.length} reviewed</span>

                </div>
              </div>
              ${signalRows || '<p class="status-line">None right now.</p>'}

            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
                <strong>Data quality issues (${qualityEvents.length})</strong>
