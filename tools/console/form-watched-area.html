<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watched area · OpenFloodAI console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="/console/shared.css">
<style>body{user-select:none;}</style>
</head>
<body style="background:var(--paper);">
<div class="modal-overlay">
  <div class="modal-card" style="width:min(980px,96vw);">
    <div style="padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:15px;font-weight:600;">Watched area</div>
        <div style="font-size:12px;color:var(--ink-muted);margin-top:2px;" id="siteLabel">&hellip;</div>
      </div>
      <a id="closeLink" href="#" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </a>
    </div>
    <div id="body" style="display:flex;min-height:0;">
      <div style="flex-grow:1;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;">
        <div id="stage" style="width:640px;height:400px;position:relative;border-radius:8px;overflow:hidden;background:#33444d;">
          <img id="stageImg" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Baseline image">
          <div id="box" style="position:absolute;border:2px solid #f2c94c;background:rgba(242,201,76,0.16);cursor:move;">
            <div id="resizeHandle" style="position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:3px;background:#f2c94c;border:2px solid #fff;cursor:nwse-resize;"></div>
          </div>
        </div>
        <div id="sequenceRow" style="width:640px;display:flex;align-items:center;gap:10px;" hidden>
          <label for="sequenceSelect" style="font-size:11px;color:var(--ink-muted);white-space:nowrap;">Image sequence</label>
          <select id="sequenceSelect" style="flex-grow:1;min-width:0;"></select>
        </div>
        <div id="scrubRow" style="width:640px;display:flex;align-items:center;gap:10px;" hidden>
          <span id="scrubLabel" style="font-size:11px;color:var(--ink-muted);white-space:nowrap;">Video frame</span>
          <input type="range" id="scrub" min="0" max="1" step="0.1" value="0" style="flex-grow:1;">
          <span id="scrubTime" style="font-size:11px;color:var(--ink-muted);font-family:var(--mono);white-space:nowrap;">0.0s</span>
        </div>
        <div id="imageCaption" style="white-space:pre-line;width:640px;font-size:12px;color:var(--ink-soft);font-family:var(--mono);overflow-wrap:anywhere;" hidden></div>
        <video id="sourceVideo" style="display:none;" preload="metadata" muted playsinline></video>
        <canvas id="captureCanvas" width="640" height="400" style="display:none;"></canvas>
      </div>
      <div style="width:270px;flex-shrink:0;border-left:1px solid var(--line-soft);padding:20px;display:flex;flex-direction:column;gap:14px;">
        <div>
          <div class="hint" style="text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;">Region &middot; percent of frame</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div style="background:var(--paper);border-radius:7px;padding:8px 10px;"><div style="font-size:10px;color:var(--ink-muted);">x</div><div id="xOut" style="font-size:14px;font-weight:600;font-family:var(--mono);">&mdash;</div></div>
            <div style="background:var(--paper);border-radius:7px;padding:8px 10px;"><div style="font-size:10px;color:var(--ink-muted);">y</div><div id="yOut" style="font-size:14px;font-weight:600;font-family:var(--mono);">&mdash;</div></div>
            <div style="background:var(--paper);border-radius:7px;padding:8px 10px;"><div style="font-size:10px;color:var(--ink-muted);">width</div><div id="wOut" style="font-size:14px;font-weight:600;font-family:var(--mono);">&mdash;</div></div>
            <div style="background:var(--paper);border-radius:7px;padding:8px 10px;"><div style="font-size:10px;color:var(--ink-muted);">height</div><div id="hOut" style="font-size:14px;font-weight:600;font-family:var(--mono);">&mdash;</div></div>
          </div>
        </div>
        <div style="font-size:12px;color:var(--ink-soft);line-height:1.5;">Drag the box to move it, drag the corner handle to resize, or drag anywhere on the empty image to draw a brand new area.</div>
        <button id="resetBtn" class="btn">Reset to saved value</button>
        <button id="clearBtn" class="btn">Clear and redraw</button>
        <div style="flex-grow:1;"></div>
        <div id="formError" class="err" hidden></div>
        <button id="saveBtn" class="btn primary" style="justify-content:center;">Save watched area</button>
      </div>
    </div>
  </div>
</div>
<script src="/console/shared.js"></script>
<script>
const folderName = qs("site");
const stageW = 640, stageH = 400;
let saved = null;
let rect = { x: 10, y: 10, width: 60, height: 60 };
let sequenceId = null;
let baselineFilename = null;
let videoId = null;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function captureVideoFrame() {
  const video = $("sourceVideo");
  const canvas = $("captureCanvas");
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  $("stageImg").src = canvas.toDataURL("image/jpeg", 0.92);
}

function loadVideoSource() {
  return new Promise((resolve) => {
    const video = $("sourceVideo");
    video.src = `/api/site-video?${new URLSearchParams({ folder_name: folderName, video_id: videoId })}`;
    video.addEventListener(
      "loadedmetadata",
      () => {
        $("scrub").max = video.duration || 1;
        $("scrub").value = 0;
        video.currentTime = 0;
        resolve();
      },
      { once: true }
    );
    video.addEventListener("seeked", () => {
      $("scrubTime").textContent = `${video.currentTime.toFixed(1)}s`;
      captureVideoFrame();
    });
    $("scrubRow").hidden = false;
    $("scrub").addEventListener("input", () => {
      video.currentTime = Number($("scrub").value);
    });
  });
}

function paintBox() {
  const box = $("box");
  box.style.left = `${(rect.x / 100) * stageW}px`;
  box.style.top = `${(rect.y / 100) * stageH}px`;
  box.style.width = `${(rect.width / 100) * stageW}px`;
  box.style.height = `${(rect.height / 100) * stageH}px`;
  $("xOut").textContent = rect.x.toFixed(1);
  $("yOut").textContent = rect.y.toFixed(1);
  $("wOut").textContent = rect.width.toFixed(1);
  $("hOut").textContent = rect.height.toFixed(1);
}

let dragMode = null, startX = 0, startY = 0, startRect = null, drawOrigin = null;
function stagePointPct(event) {
  const stageRect = $("stage").getBoundingClientRect();
  return {
    x: clamp(((event.clientX - stageRect.left) / stageRect.width) * 100, 0, 100),
    y: clamp(((event.clientY - stageRect.top) / stageRect.height) * 100, 0, 100)
  };
}
function onDrag(event) {
  if (dragMode === "draw") {
    const point = stagePointPct(event);
    const x0 = Math.min(drawOrigin.x, point.x);
    const y0 = Math.min(drawOrigin.y, point.y);
    const x1 = Math.max(drawOrigin.x, point.x);
    const y1 = Math.max(drawOrigin.y, point.y);
    rect = { x: x0, y: y0, width: Math.max(x1 - x0, 1), height: Math.max(y1 - y0, 1) };
    paintBox();
    return;
  }
  const dxPct = ((event.clientX - startX) / stageW) * 100;
  const dyPct = ((event.clientY - startY) / stageH) * 100;
  if (dragMode === "move") {
    rect = { ...startRect, x: clamp(startRect.x + dxPct, 0, 100 - startRect.width), y: clamp(startRect.y + dyPct, 0, 100 - startRect.height) };
  } else if (dragMode === "resize") {
    rect = { ...startRect, width: clamp(startRect.width + dxPct, 5, 100 - startRect.x), height: clamp(startRect.height + dyPct, 5, 100 - startRect.y) };
  }
  paintBox();
}
function onDragEnd() {
  if (dragMode === "draw" && (rect.width < 3 || rect.height < 3)) {
    rect = { ...(startRect || { x: 10, y: 10, width: 60, height: 60 }) };
    paintBox();
  }
  dragMode = null;
  drawOrigin = null;
  window.removeEventListener("mousemove", onDrag);
  window.removeEventListener("mouseup", onDragEnd);
}
$("box").addEventListener("mousedown", (event) => {
  if (event.target === $("resizeHandle")) return;
  event.preventDefault();
  dragMode = "move"; startX = event.clientX; startY = event.clientY; startRect = { ...rect };
  window.addEventListener("mousemove", onDrag);
  window.addEventListener("mouseup", onDragEnd);
});
$("resizeHandle").addEventListener("mousedown", (event) => {
  event.preventDefault(); event.stopPropagation();
  dragMode = "resize"; startX = event.clientX; startY = event.clientY; startRect = { ...rect };
  window.addEventListener("mousemove", onDrag);
  window.addEventListener("mouseup", onDragEnd);
});
$("stage").addEventListener("mousedown", (event) => {
  if (event.target !== $("stage") && event.target !== $("stageImg")) return;
  event.preventDefault();
  startRect = { ...rect };
  dragMode = "draw";
  drawOrigin = stagePointPct(event);
  rect = { x: drawOrigin.x, y: drawOrigin.y, width: 0, height: 0 };
  paintBox();
  window.addEventListener("mousemove", onDrag);
  window.addEventListener("mouseup", onDragEnd);
});
$("resetBtn").addEventListener("click", () => {
  if (saved) { rect = { ...saved }; paintBox(); }
});
$("clearBtn").addEventListener("click", () => {
  rect = { x: 30, y: 30, width: 40, height: 40 };
  paintBox();
});

// Downloaded images of one sequence, oldest capture first, so the slider runs through time.
function downloadedImages(sequence) {
  return ((sequence && sequence.records) || [])
    .filter((r) => r.download_status === "downloaded" && r.filename)
    .sort((a, b) => String(a.captured_at_utc || "").localeCompare(String(b.captured_at_utc || "")));
}

function sequenceOptionLabel(sequence) {
  return `${sequence.display_name || sequence.sequence_id} (${downloadedImages(sequence).length} images)`;
}

// "<filename> · captured <local time> (<UTC>)", from whatever the record carries.
function imageCaptionText(record) {
  const parts = [record.filename];
  if (record.local_time) parts.push(`local ${String(record.local_time).replace("T", " ")}`);
  if (record.captured_at_utc) parts.push(`UTC ${String(record.captured_at_utc).replace("T", " ").replace("+00:00", "")}`);
  return parts.join(" \u00b7 ");
}

// The gauge reading saved with an image (water-level sequences only), e.g. "Gauge 3.15 ft · low · approved".
function gaugeReadingText(sample) {
  if (!sample || sample.level === undefined || sample.level === null) return "No gauge reading saved for this image";
  const level = Number(sample.level);
  const parts = [`Gauge ${Number.isFinite(level) ? level.toFixed(2) : sample.level} ${sample.unit || ""}`.trim()];
  if (sample.group) parts.push(sample.group);
  if (sample.quality_status) parts.push(sample.quality_status);
  return parts.join(" \u00b7 ");
}

let imageSequences = [];
let currentImages = [];

function showImage(index) {
  const record = currentImages[index];
  if (!record) return;
  baselineFilename = record.filename;
  $("stageImg").src = `/api/image-sequence-image?${new URLSearchParams({ folder_name: folderName, sequence_id: sequenceId, filename: baselineFilename })}`;
  $("scrubTime").textContent = `${index + 1} / ${currentImages.length}`;
  const sequence = imageSequences.find((s) => s.sequence_id === sequenceId) || {};
  const sample = (sequence.water_level_samples || {})[record.filename];
  $("imageCaption").textContent = `${imageCaptionText(record)}\n${gaugeReadingText(sample)}`;
  $("imageCaption").hidden = false;
}

function selectSequence(id) {
  const sequence = imageSequences.find((s) => s.sequence_id === id);
  sequenceId = id;
  currentImages = downloadedImages(sequence);
  $("scrub").max = Math.max(currentImages.length - 1, 0);
  $("scrub").value = 0;
  showImage(0);
}

function setUpImagePicker(sequences) {
  imageSequences = sequences.filter((s) => downloadedImages(s).length);
  const select = $("sequenceSelect");
  select.innerHTML = imageSequences
    .map((s) => `<option value="${escapeHtml(s.sequence_id)}">${escapeHtml(sequenceOptionLabel(s))}</option>`)
    .join("");
  // Newest sequence that has images first, matching what the editor used to pick on its own.
  const newest = imageSequences[imageSequences.length - 1];
  select.value = newest.sequence_id;
  $("scrubLabel").textContent = "Image";
  $("scrub").step = 1;
  $("sequenceRow").hidden = false;
  $("scrubRow").hidden = false;
  select.addEventListener("change", () => selectSequence(select.value));
  $("scrub").addEventListener("input", () => showImage(Number($("scrub").value)));
  selectSequence(newest.sequence_id);
}

async function main() {
  if (!folderName) {
    document.body.innerHTML = `<div style="padding:40px;">Missing <code>?site=</code> in the URL.</div>`;
    return;
  }
  $("closeLink").href = `/console/site.html?${new URLSearchParams({ site: folderName })}`;
  $("siteLabel").textContent = folderName;

  try {
    const [configData, sequenceData, manifestData] = await Promise.all([
      api(`/api/site-config?${new URLSearchParams({ folder_name: folderName })}`),
      api(`/api/site-image-sequences?${new URLSearchParams({ folder_name: folderName })}`),
      api(`/api/site-manifest?${new URLSearchParams({ folder_name: folderName })}`).catch(() => ({ records: [] }))
    ]);
    const cfg = configData.config || {};
    if (cfg.reference_region) {
      saved = { x: cfg.reference_region.x, y: cfg.reference_region.y, width: cfg.reference_region.width, height: cfg.reference_region.height };
      rect = { ...saved };
    }
    paintBox();

    if ((sequenceData.sequences || []).some((seq) => downloadedImages(seq).length)) {
      setUpImagePicker(sequenceData.sequences);
    }
    if (!baselineFilename) {
      const firstVideo = (manifestData.records || [])[0];
      if (firstVideo && firstVideo.video_id) {
        videoId = firstVideo.video_id;
        await loadVideoSource();
      }
    }
    if (!baselineFilename && !videoId) {
      // Replacing the body also removes the Save button, so there is nothing left to disable.
      $("body").innerHTML = `<div style="padding:24px;font-size:13px;color:var(--ink-soft);">This site has no downloaded image sequence and no video yet. Add media first from Site &rarr; Setup &rarr; Add media.</div>`;
      return;
    }
  } catch (error) {
    $("body").innerHTML = `<div style="padding:24px;font-size:13px;color:var(--bad);">Could not load this site: ${escapeHtml(error.message)}</div>`;
  }
}

$("saveBtn").addEventListener("click", async () => {
  $("saveBtn").disabled = true;
  $("saveBtn").innerHTML = '<span class="spinner"></span>Saving…';
  $("formError").hidden = true;
  try {
    const source = baselineFilename
      ? { sequence_id: sequenceId, image_filename: baselineFilename }
      : { video_id: videoId, video_time_seconds: Number($("scrub").value) || 0 };
    await api("/api/set-watched-area", {
      folder_name: folderName,
      ...source,
      reference_region: rect
    });
    location.href = `/console/site.html?${new URLSearchParams({ site: folderName })}`;
  } catch (error) {
    $("formError").hidden = false;
    $("formError").textContent = error.message;
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = "Save watched area";
  }
});

main();
</script>
</body>
</html>
