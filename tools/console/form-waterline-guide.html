<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverbank guide · OpenFloodAI console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="/console/shared.css">
<style>body{user-select:none;}</style>
</head>
<body style="background:var(--paper);">
<div class="modal-overlay">
  <div class="modal-card" style="width:min(900px,96vw);">
    <div style="padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:15px;font-weight:600;">Riverbank baseline guide</div>
        <div style="font-size:12px;color:var(--ink-muted);margin-top:2px;" id="siteLabel">&hellip;</div>
      </div>
      <a id="closeLink" href="#" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </a>
    </div>
    <div id="body" style="display:flex;min-height:0;">
      <div style="flex-grow:1;padding:20px;display:flex;align-items:center;justify-content:center;">
        <svg id="stage" viewBox="0 0 640 400" style="width:640px;height:400px;border-radius:8px;cursor:crosshair;background:#33444d;">
          <image id="stageImg" x="0" y="0" width="640" height="400" preserveAspectRatio="xMidYMid slice"></image>
          <polyline id="line" fill="none" stroke="#7fe0b4" stroke-width="2.5"></polyline>
          <g id="dots"></g>
        </svg>
      </div>
      <div style="width:270px;flex-shrink:0;border-left:1px solid var(--line-soft);padding:20px;display:flex;flex-direction:column;gap:14px;">
        <div>
          <div class="hint" style="text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;">Points &middot; <span id="pointCount">0</span></div>
          <div style="font-size:12px;color:var(--ink-soft);line-height:1.5;">Click on the image to add a point along the waterline. Need at least 2 to save.</div>
        </div>
        <button id="clearBtn" class="btn">Clear points</button>
        <div style="height:1px;background:var(--line-soft);"></div>
        <div>
          <div class="hint" style="text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;">Condition</div>
          <button id="normalToggle" style="width:100%;text-align:left;border:1.5px solid var(--ok);background:var(--ok-soft);border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;">
            <div id="normalDot" style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ok);background:var(--ok);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <div>
              <div style="font-size:12px;font-weight:600;">Mark as normal condition</div>
              <div style="font-size:11px;color:var(--ink-muted);">Typical, non-flood water level</div>
            </div>
          </button>
        </div>
        <div style="flex-grow:1;"></div>
        <div id="formError" class="err" hidden></div>
        <button id="saveBtn" class="btn primary" style="justify-content:center;" disabled>Save guide</button>
      </div>
    </div>
  </div>
</div>
<script src="/console/shared.js"></script>
<script>
const folderName = qs("site");
let points = [];
let normalCondition = true;
let sequenceId = null;
let baselineFilename = null;

function render() {
  $("pointCount").textContent = points.length;
  $("line").setAttribute("points", points.map((p) => `${p.x},${p.y}`).join(" "));
  $("line").setAttribute("stroke", normalCondition ? "#7fe0b4" : "#f2c94c");
  $("line").setAttribute("stroke-dasharray", normalCondition ? "0" : "4,3");
  $("dots").innerHTML = points.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${normalCondition ? "#7fe0b4" : "#f2c94c"}" stroke="#fff" stroke-width="1.5"/>`).join("");
  $("saveBtn").disabled = points.length < 2;
}

$("stage").addEventListener("click", (event) => {
  const rect = $("stage").getBoundingClientRect();
  const x = ((event.clientX - rect.left) / rect.width) * 640;
  const y = ((event.clientY - rect.top) / rect.height) * 400;
  points.push({ x, y });
  render();
});
$("clearBtn").addEventListener("click", () => { points = []; render(); });
$("normalToggle").addEventListener("click", () => {
  normalCondition = !normalCondition;
  $("normalToggle").style.borderColor = normalCondition ? "var(--ok)" : "var(--line)";
  $("normalToggle").style.background = normalCondition ? "var(--ok-soft)" : "#fff";
  $("normalDot").style.borderColor = normalCondition ? "var(--ok)" : "var(--line)";
  $("normalDot").style.background = normalCondition ? "var(--ok)" : "transparent";
  $("normalDot").innerHTML = normalCondition ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : "";
  render();
});

async function main() {
  if (!folderName) {
    document.body.innerHTML = `<div style="padding:40px;">Missing <code>?site=</code> in the URL.</div>`;
    return;
  }
  $("closeLink").href = `/console/site.html?${new URLSearchParams({ site: folderName })}`;
  $("siteLabel").textContent = folderName;
  render();

  try {
    const sequenceData = await api(`/api/site-image-sequences?${new URLSearchParams({ folder_name: folderName })}`);
    const sequences = sequenceData.sequences || [];
    if (sequences.length) {
      const seq = sequences[sequences.length - 1];
      sequenceId = seq.sequence_id;
      const downloaded = (seq.records || []).find((r) => r.download_status === "downloaded");
      if (downloaded) {
        baselineFilename = downloaded.filename;
        $("stageImg").setAttribute(
          "href",
          `/api/image-sequence-image?${new URLSearchParams({ folder_name: folderName, sequence_id: sequenceId, filename: baselineFilename })}`
        );
      }
    }
    if (!baselineFilename) {
      $("body").innerHTML = `<div style="padding:24px;font-size:13px;color:var(--ink-soft);">This site has no downloaded image sequence yet. Add one first from Site &rarr; Setup &rarr; Add media.</div>`;
    }
  } catch (error) {
    $("body").innerHTML = `<div style="padding:24px;font-size:13px;color:var(--bad);">Could not load this site: ${escapeHtml(error.message)}</div>`;
  }
}

$("saveBtn").addEventListener("click", async () => {
  $("saveBtn").disabled = true;
  $("saveBtn").innerHTML = '<span class="spinner"></span>Saving…';
  $("formError").hidden = true;
  try {
    await api("/api/set-normal-waterline-guide", {
      folder_name: folderName,
      sequence_id: sequenceId,
      image_filename: baselineFilename,
      id: `guide-${Date.now()}`,
      label: normalCondition ? "Normal waterline" : "Waterline (draft)",
      points: points.map((p) => ({ x: p.x, y: p.y })),
      status: "confirmed",
      normal_condition: normalCondition,
      notes: ""
    });
    location.href = `/console/site.html?${new URLSearchParams({ site: folderName })}`;
  } catch (error) {
    $("formError").hidden = false;
    $("formError").textContent = error.message;
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = "Save guide";
  }
});

main();
</script>
</body>
</html>
