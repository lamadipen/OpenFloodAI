<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverbank guide · OpenFloodAI console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<link rel="stylesheet" href="/console/shared.css">
<style>body{user-select:none;}</style>
</head>
<body style="background:var(--paper);">
<div class="modal-overlay">
  <div class="modal-card" style="width:min(1040px,97vw);">
    <div style="padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:15px;font-weight:600;">Riverbank baseline guides</div>
        <div style="font-size:12px;color:var(--ink-muted);margin-top:2px;" id="siteLabel">&hellip;</div>
      </div>
      <a id="closeLink" href="#" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </a>
    </div>
    <div id="body" style="display:flex;min-height:0;">
      <div style="flex-grow:1;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;">
        <svg id="stage" viewBox="0 0 640 400" style="width:640px;height:400px;border-radius:8px;cursor:crosshair;background:#33444d;">
          <image id="stageImg" x="0" y="0" width="640" height="400" preserveAspectRatio="xMidYMid slice"></image>
          <rect id="watchedAreaBox" fill="none" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="6,4" style="pointer-events:none;" hidden></rect>
          <text id="watchedAreaLabel" fill="#f2c94c" font-size="11" font-family="var(--mono)" style="pointer-events:none;" hidden>Watched area</text>
          <g id="lines"></g>
        </svg>
        <div id="statusLine" class="hint" style="width:640px;"></div>
        <div id="sourceNote" class="hint" style="width:640px;overflow-wrap:anywhere;" hidden></div>
        <div id="scrubRow" style="width:640px;display:flex;align-items:center;gap:10px;" hidden>
          <span style="font-size:11px;color:var(--ink-muted);white-space:nowrap;">Video frame</span>
          <input type="range" id="scrub" min="0" max="1" step="0.1" value="0" style="flex-grow:1;">
          <span id="scrubTime" style="font-size:11px;color:var(--ink-muted);font-family:var(--mono);white-space:nowrap;">0.0s</span>
        </div>
        <video id="sourceVideo" style="display:none;" preload="metadata" muted playsinline></video>
        <canvas id="captureCanvas" width="640" height="400" style="display:none;"></canvas>
      </div>
      <div style="width:330px;flex-shrink:0;border-left:1px solid var(--line-soft);padding:16px;display:flex;flex-direction:column;gap:10px;max-height:640px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="hint" style="text-transform:uppercase;letter-spacing:.03em;">Lines &middot; <span id="lineCount">0</span></div>
          <button id="addLineBtn" class="btn" style="font-size:11px;padding:5px 10px;">+ Add line</button>
        </div>
        <div id="rowsContainer" style="flex-grow:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px;"></div>
        <div id="emptyRows" class="hint" style="padding:8px 0;">No lines yet. Click "+ Add line" to trace the first bank.</div>
        <div id="formError" class="err" hidden></div>
        <button id="saveBtn" class="btn primary" style="justify-content:center;" disabled>Save all guides</button>
      </div>
    </div>
  </div>
</div>
<script src="/console/shared.js"></script>
<script src="/console/guide-source-matching.js"></script>
<script>
const folderName = qs("site");
let sequenceId = null;
let baselineFilename = null;
let videoId = null;
let videoTimeSeconds = 0;
let watchedArea = null;
let rows = [];
let activeUid = null;
let placingWaterSideFor = null;

const INVALIDATION_REASONS = [
  ["camera_moved", "Camera moved"],
  ["view_changed", "View changed"],
  ["bank_changed", "Bank changed"],
  ["visibility_unreliable", "Visibility no longer reliable"],
  ["other", "Other"]
];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function uid() { return `row-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`; }
function generateGuideId() { return `line-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`; }

function captureVideoFrame() {
  const video = $("sourceVideo");
  const canvas = $("captureCanvas");
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  $("stageImg").setAttribute("href", canvas.toDataURL("image/jpeg", 0.92));
}

function paintWatchedArea() {
  if (!watchedArea) {
    $("watchedAreaBox").hidden = true;
    $("watchedAreaLabel").hidden = true;
    return;
  }
  const x = (watchedArea.x / 100) * 640;
  const y = (watchedArea.y / 100) * 400;
  const w = (watchedArea.width / 100) * 640;
  const h = (watchedArea.height / 100) * 400;
  $("watchedAreaBox").setAttribute("x", x);
  $("watchedAreaBox").setAttribute("y", y);
  $("watchedAreaBox").setAttribute("width", w);
  $("watchedAreaBox").setAttribute("height", h);
  $("watchedAreaBox").hidden = false;
  $("watchedAreaLabel").setAttribute("x", x + 4);
  $("watchedAreaLabel").setAttribute("y", Math.max(y - 6, 10));
  $("watchedAreaLabel").hidden = false;
}

function toPixelPoint(pct) {
  return { x: (pct.x / 100) * 640, y: (pct.y / 100) * 400 };
}

function toPercentPoint(px) {
  return { x: (px.x / 640) * 100, y: (px.y / 400) * 100 };
}

function clampToWatchedArea(x, y) {
  if (!watchedArea) return { x: clamp(x, 0, 640), y: clamp(y, 0, 400) };
  const minX = (watchedArea.x / 100) * 640;
  const minY = (watchedArea.y / 100) * 400;
  const maxX = minX + (watchedArea.width / 100) * 640;
  const maxY = minY + (watchedArea.height / 100) * 400;
  return { x: clamp(x, minX, maxX), y: clamp(y, minY, maxY) };
}

function activeRow() {
  return rows.find((r) => r.uid === activeUid) || null;
}

function statusLineText() {
  const active = activeRow();
  if (placingWaterSideFor) {
    const row = rows.find((r) => r.uid === placingWaterSideFor);
    const name = (row && row.fields && row.fields.label.value.trim()) || "this line";
    return `Click the spot in the water for "${name}", on the wet side of the line.`;
  }
  if (!rows.length) return 'Click "+ Add line" to start tracing the first bank.';
  if (!active) return "Choose a line on the right (or add another) to keep drawing.";
  if (active.points.length === 0) return "Click inside the dashed watched area to start this line.";
  if (active.points.length === 1) return "1 point added. Click to add another point along the bank.";
  return `${active.points.length} points on this line. Keep clicking to follow the curve, or draw another line.`;
}

function waterMarkerSvg(point, isActive) {
  const fill = isActive ? "#4ea1ff" : "#7d93a3";
  return `<g>
    <circle cx="${point.x}" cy="${point.y}" r="${isActive ? 7 : 5.5}" fill="${fill}" stroke="#fff" stroke-width="1.2"/>
    <text x="${point.x}" y="${point.y + 3.5}" font-size="9" font-family="var(--sans)" font-weight="700" fill="#fff" text-anchor="middle">W</text>
  </g>`;
}

function drawLines() {
  $("lines").innerHTML = rows
    .map((row) => {
      const isActive = row.uid === activeUid;
      let html = "";
      if (row.points.length) {
        const stroke = isActive ? "#7fe0b4" : "#9fb0bd";
        const width = isActive ? 2.5 : 1.5;
        const dash = row.status === "invalid" ? ' stroke-dasharray="3,3"' : "";
        const poly = `<polyline points="${row.points.map((p) => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="${stroke}" stroke-width="${width}"${dash}/>`;
        const dots = row.points.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="${isActive ? 5 : 3.5}" fill="${stroke}" stroke="#fff" stroke-width="1.2"/>`).join("");
        html += poly + dots;
      }
      if (row.waterSidePoint) html += waterMarkerSvg(row.waterSidePoint, isActive);
      return html;
    })
    .join("");
  $("statusLine").textContent = statusLineText();
}

function updateSaveState() {
  $("lineCount").textContent = rows.length;
  $("emptyRows").hidden = rows.length > 0;
  $("saveBtn").disabled = rows.length === 0;
}

function setActiveRow(rowUid) {
  activeUid = rowUid;
  rows.forEach((row) => {
    if (!row.el) return;
    row.el.style.borderColor = row.uid === rowUid ? "var(--accent)" : "var(--line)";
    if (row.fields) row.fields.drawButton.textContent = row.uid === rowUid ? "Drawing…" : "Draw";
  });
  drawLines();
}

function styleSelect(el) {
  el.style.cssText = "width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:var(--sans);";
}

function buildRowElement(row, initial) {
  const wrapper = document.createElement("div");
  wrapper.className = "card";
  wrapper.style.cssText = "padding:10px 12px;border-width:1.5px;display:flex;flex-direction:column;gap:8px;";

  const header = document.createElement("div");
  header.style.cssText = "display:flex;gap:6px;align-items:center;";

  const labelInput = document.createElement("input");
  labelInput.placeholder = "e.g. left bank";
  labelInput.value = initial.label || "";
  labelInput.style.cssText = "flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;";

  const drawButton = document.createElement("button");
  drawButton.type = "button";
  drawButton.className = "btn";
  drawButton.style.cssText = "font-size:11px;padding:5px 9px;white-space:nowrap;";
  drawButton.textContent = "Draw";
  drawButton.addEventListener("click", () => setActiveRow(row.uid));

  const deleteButton = document.createElement("button");
  deleteButton.type = "button";
  deleteButton.className = "btn";
  deleteButton.style.cssText = "font-size:11px;padding:5px 9px;color:var(--bad);white-space:nowrap;";
  deleteButton.textContent = "Delete";
  deleteButton.addEventListener("click", async () => {
    const name = labelInput.value.trim() || "this line";
    if (!confirm(`Delete "${name}"? This removes it permanently and cannot be undone.`)) return;
    if (row.existingOnServer) {
      deleteButton.disabled = true;
      deleteButton.textContent = "Deleting…";
      try {
        await api("/api/delete-normal-waterline-guide", { folder_name: folderName, guide_id: row.id });
      } catch (error) {
        alert(`Could not delete: ${error.message}`);
        deleteButton.disabled = false;
        deleteButton.textContent = "Delete";
        return;
      }
    }
    rows = rows.filter((r) => r.uid !== row.uid);
    wrapper.remove();
    if (placingWaterSideFor === row.uid) placingWaterSideFor = null;
    if (activeUid === row.uid) setActiveRow(rows.length ? rows[rows.length - 1].uid : null);
    else drawLines();
    updateSaveState();
  });

  header.append(labelInput, drawButton, deleteButton);

  const controlsRow = document.createElement("div");
  controlsRow.style.cssText = "display:flex;gap:6px;align-items:center;";

  const statusSelect = document.createElement("select");
  styleSelect(statusSelect);
  statusSelect.style.flex = "1";
  [["draft", "Draft"], ["confirmed", "Confirmed"], ["invalid", "Invalid"]].forEach(([value, text]) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = text;
    statusSelect.append(option);
  });
  statusSelect.value = initial.status || "draft";

  const normalLabel = document.createElement("label");
  normalLabel.style.cssText = "display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);white-space:nowrap;";
  const normalCheckbox = document.createElement("input");
  normalCheckbox.type = "checkbox";
  normalCheckbox.checked = Boolean(initial.normalCondition);
  normalLabel.append(normalCheckbox, document.createTextNode("Normal condition"));

  controlsRow.append(statusSelect, normalLabel);

  const reasonWrap = document.createElement("div");
  reasonWrap.hidden = statusSelect.value !== "invalid";
  const reasonSelect = document.createElement("select");
  styleSelect(reasonSelect);
  INVALIDATION_REASONS.forEach(([value, text]) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = text;
    reasonSelect.append(option);
  });
  reasonSelect.value = initial.invalidationReason || "camera_moved";
  reasonWrap.append(reasonSelect);
  statusSelect.addEventListener("change", () => {
    reasonWrap.hidden = statusSelect.value !== "invalid";
  });

  const notesInput = document.createElement("textarea");
  notesInput.rows = 1;
  notesInput.placeholder = "Notes (optional)";
  notesInput.value = initial.notes || "";
  notesInput.style.cssText = "width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;resize:vertical;";

  const pointCount = document.createElement("div");
  pointCount.className = "hint";
  pointCount.textContent = `${row.points.length} point(s) traced.`;

  const waterSideRow = document.createElement("div");
  waterSideRow.style.cssText = "display:flex;align-items:center;gap:6px;";
  const waterSideStatus = document.createElement("span");
  waterSideStatus.className = "hint";
  waterSideStatus.style.flex = "1";
  const waterSideBtn = document.createElement("button");
  waterSideBtn.type = "button";
  waterSideBtn.className = "btn";
  waterSideBtn.style.cssText = "font-size:11px;padding:5px 9px;white-space:nowrap;";
  const waterSideClearBtn = document.createElement("button");
  waterSideClearBtn.type = "button";
  waterSideClearBtn.className = "btn";
  waterSideClearBtn.style.cssText = "font-size:11px;padding:5px 9px;white-space:nowrap;";
  waterSideClearBtn.textContent = "Clear";
  waterSideClearBtn.addEventListener("click", () => {
    row.waterSidePoint = null;
    if (placingWaterSideFor === row.uid) placingWaterSideFor = null;
    refreshWaterSideRow(row);
    drawLines();
  });
  waterSideBtn.addEventListener("click", () => {
    setActiveRow(row.uid);
    placingWaterSideFor = placingWaterSideFor === row.uid ? null : row.uid;
    rows.forEach((r) => r.fields && refreshWaterSideRow(r));
    drawLines();
  });
  waterSideRow.append(waterSideStatus, waterSideBtn, waterSideClearBtn);

  wrapper.append(header, controlsRow, reasonWrap, notesInput, pointCount, waterSideRow);

  row.el = wrapper;
  row.fields = {
    label: labelInput,
    drawButton,
    status: statusSelect,
    invalidationReason: reasonSelect,
    normalCondition: normalCheckbox,
    notes: notesInput,
    pointCount,
    waterSideStatus,
    waterSideBtn,
    waterSideClearBtn
  };
  refreshWaterSideRow(row);
  return wrapper;
}

function refreshWaterSideRow(row) {
  if (!row.fields) return;
  const placing = placingWaterSideFor === row.uid;
  row.fields.waterSideStatus.textContent = row.waterSidePoint
    ? "Water side: set"
    : "Water side: not set";
  row.fields.waterSideBtn.textContent = placing ? "Click the water…" : "Set water side";
  row.fields.waterSideClearBtn.hidden = !row.waterSidePoint;
}

function addRow(initial) {
  const row = {
    uid: uid(),
    id: initial.id,
    existingOnServer: Boolean(initial.existingOnServer),
    points: initial.points || [],
    waterSidePoint: initial.waterSidePoint || null,
    status: initial.status || "draft",
    // The exact media this line was originally traced on -- null for a
    // brand-new, never-saved line. Saving must reuse this, never whatever
    // media happens to be on screen right now (see savingSourceForRow).
    savedSource: initial.savedSource || null,
    el: null,
    fields: null
  };
  rows.push(row);
  $("rowsContainer").append(buildRowElement(row, initial));
  updateSaveState();
  return row;
}

$("addLineBtn").addEventListener("click", () => {
  const row = addRow({ id: generateGuideId(), existingOnServer: false, points: [], label: "", status: "draft", normalCondition: false, notes: "" });
  setActiveRow(row.uid);
});

$("stage").addEventListener("click", (event) => {
  const rect = $("stage").getBoundingClientRect();
  const rawX = ((event.clientX - rect.left) / rect.width) * 640;
  const rawY = ((event.clientY - rect.top) / rect.height) * 400;

  if (placingWaterSideFor) {
    const row = rows.find((r) => r.uid === placingWaterSideFor);
    if (row) {
      row.waterSidePoint = clampToWatchedArea(rawX, rawY);
      refreshWaterSideRow(row);
    }
    placingWaterSideFor = null;
    drawLines();
    return;
  }

  const active = activeRow();
  if (!active) {
    $("statusLine").textContent = 'Choose a line on the right (or click "+ Add line") before clicking the image.';
    return;
  }
  active.points.push(clampToWatchedArea(rawX, rawY));
  drawLines();
  if (active.fields) active.fields.pointCount.textContent = `${active.points.length} point(s) traced.`;
});

// The newest sequence that actually has a downloaded image. A newer sequence with none (for
// example a download that found nothing for a short date range) must not hide older images.
function pickImageSource(sequences) {
  for (let i = sequences.length - 1; i >= 0; i -= 1) {
    const downloaded = (sequences[i].records || []).find((r) => r.download_status === "downloaded");
    if (downloaded) return { sequenceId: sequences[i].sequence_id, filename: downloaded.filename };
  }
  return null;
}

// Which image or video moment to show. The watched area's own image comes first, so the
// baseline is always the frame the area was drawn on. The one exception is a site whose guides
// were already traced on a different frame: those lines only line up on their own frame, so it
// keeps showing that one and says where the watched area was drawn.
function chooseBaselineSource({ areaSource, guide, sequences }) {
  const guideSource = guide
    ? guide.image_sequence_id
      ? { image_sequence_id: guide.image_sequence_id, image_filename: guide.image_filename }
      : guide.video_id
        ? { video_id: guide.video_id, video_time_seconds: guide.video_time_seconds || 0 }
        : null
    : null;
  let area = areaSource || null;
  if (area && area.image_sequence_id) {
    const sequence = (sequences || []).find((s) => s.sequence_id === area.image_sequence_id);
    const record = ((sequence && sequence.records) || []).find(
      (r) => r.filename === area.image_filename && r.download_status === "downloaded"
    );
    if (!record) area = null; // the image was removed: fall back rather than show a broken frame
  }
  if (guideSource && !(area && sourcesMatch(guideSource, area))) {
    return { source: guideSource, areaSource: area, fromWatchedArea: false };
  }
  if (area) return { source: area, areaSource: area, fromWatchedArea: true };
  return { source: null, areaSource: null, fromWatchedArea: false };
}

function describeAreaSource(area, sequences) {
  if (!area) return "";
  if (area.video_id) return `Watched area was drawn on video ${area.video_id} at ${Number(area.video_time_seconds || 0).toFixed(1)}s.`;
  const sequence = (sequences || []).find((s) => s.sequence_id === area.image_sequence_id);
  const record = ((sequence && sequence.records) || []).find((r) => r.filename === area.image_filename) || {};
  const when = record.local_time ? ` (${String(record.local_time).replace("T", " ")})` : "";
  return `Watched area was drawn on ${area.image_filename}${when}.`;
}

async function main() {
  if (!folderName) {
    document.body.innerHTML = `<div style="padding:40px;">Missing <code>?site=</code> in the URL.</div>`;
    return;
  }
  $("closeLink").href = `/console/site.html?${new URLSearchParams({ site: folderName })}`;
  $("siteLabel").textContent = folderName;
  $("statusLine").textContent = statusLineText();

  try {
    const [sequenceData, manifestData, configData] = await Promise.all([
      api(`/api/site-image-sequences?${new URLSearchParams({ folder_name: folderName })}`),
      api(`/api/site-manifest?${new URLSearchParams({ folder_name: folderName })}`).catch(() => ({ records: [] })),
      api(`/api/site-config?${new URLSearchParams({ folder_name: folderName })}`).catch(() => ({ config: {} }))
    ]);
    const cfg = configData.config || {};
    if (cfg.reference_region) {
      watchedArea = { x: cfg.reference_region.x, y: cfg.reference_region.y, width: cfg.reference_region.width, height: cfg.reference_region.height };
    }
    paintWatchedArea();

    const existingGuides = cfg.normal_waterline_guides || [];
    // Show the frame the watched area was drawn on. A site whose guides were traced on a
    // different frame keeps that frame (see chooseBaselineSource); a site with neither falls
    // back to the newest sequence that has an image.
    const referenceGuide = existingGuides[0] || null;
    const chosen = chooseBaselineSource({
      areaSource: cfg.reference_region_source,
      guide: referenceGuide,
      sequences: sequenceData.sequences || []
    });
    if (chosen.source && chosen.source.image_sequence_id) {
      sequenceId = chosen.source.image_sequence_id;
      baselineFilename = chosen.source.image_filename;
      $("stageImg").setAttribute(
        "href",
        `/api/image-sequence-image?${new URLSearchParams({ folder_name: folderName, sequence_id: sequenceId, filename: baselineFilename })}`
      );
    } else if (chosen.source && chosen.source.video_id) {
      videoId = chosen.source.video_id;
      await loadVideoSource(chosen.source.video_time_seconds || 0);
    } else {
      const source = pickImageSource(sequenceData.sequences || []);
      if (source) {
        sequenceId = source.sequenceId;
        baselineFilename = source.filename;
        $("stageImg").setAttribute(
          "href",
          `/api/image-sequence-image?${new URLSearchParams({ folder_name: folderName, sequence_id: sequenceId, filename: baselineFilename })}`
        );
      }
      if (!baselineFilename) {
        const firstVideo = (manifestData.records || [])[0];
        if (firstVideo && firstVideo.video_id) {
          videoId = firstVideo.video_id;
          await loadVideoSource(0);
        }
      }
    }
    const note = describeAreaSource(chosen.areaSource, sequenceData.sequences || []);
    if (note) {
      $("sourceNote").textContent = chosen.fromWatchedArea
        ? note
        : `${note} This view shows the frame the existing lines were traced on.`;
      $("sourceNote").hidden = false;
    }
    if (!baselineFilename && !videoId) {
      $("body").innerHTML = `<div style="padding:24px;font-size:13px;color:var(--ink-soft);">This site has no downloaded image sequence and no video yet. Add media first from Site &rarr; Setup &rarr; Add media.</div>`;
      return;
    }

    existingGuides.forEach((guide) => {
      addRow({
        id: guide.id,
        existingOnServer: true,
        points: (guide.points || []).map(toPixelPoint),
        waterSidePoint: guide.water_side_point ? toPixelPoint(guide.water_side_point) : null,
        label: guide.label || "",
        status: guide.status || "draft",
        invalidationReason: guide.invalidation_reason,
        normalCondition: Boolean(guide.normal_condition),
        notes: guide.notes || "",
        savedSource: {
          image_sequence_id: guide.image_sequence_id || "",
          image_filename: guide.image_filename || "",
          video_id: guide.video_id || "",
          video_time_seconds: guide.video_time_seconds || 0
        }
      });
    });
    if (rows.length) setActiveRow(rows[0].uid);
    else drawLines();
  } catch (error) {
    $("body").innerHTML = `<div style="padding:24px;font-size:13px;color:var(--bad);">Could not load this site: ${escapeHtml(error.message)}</div>`;
  }
}

function loadVideoSource(startAtSeconds) {
  return new Promise((resolve) => {
    const video = $("sourceVideo");
    video.src = `/api/site-video?${new URLSearchParams({ folder_name: folderName, video_id: videoId })}`;
    video.addEventListener(
      "loadedmetadata",
      () => {
        $("scrub").max = video.duration || 1;
        const target = clamp(startAtSeconds || 0, 0, video.duration || 1);
        $("scrub").value = target;
        video.currentTime = target;
        resolve();
      },
      { once: true }
    );
    video.addEventListener("seeked", () => {
      videoTimeSeconds = video.currentTime;
      $("scrubTime").textContent = `${videoTimeSeconds.toFixed(1)}s`;
      captureVideoFrame();
    });
    $("scrubRow").hidden = false;
    $("scrub").addEventListener("input", () => {
      video.currentTime = Number($("scrub").value);
    });
  });
}

// The one media source this save request will use, for every line in the
// batch -- /api/set-normal-waterline-guides always applies one source to
// the whole request, matching how it's traced (all lines are drawn while
// looking at ONE image/video). Uses the shared guideSourceIdentity() (see
// guide-source-matching.js) so this comparison is the exact same logic a
// Node test exercises directly.
function currentSource() {
  return baselineFilename
    ? { image_sequence_id: sequenceId, image_filename: baselineFilename }
    : { video_id: videoId };
}

// An existing line's own saved frame/time, never the page's current scrub
// position -- a save that only touches OTHER lines (or just adds a water
// side point) must not silently retrace this line onto whatever moment
// happens to be on screen right now. A brand-new line has no saved time
// yet, so it correctly uses wherever it was just drawn.
function savingVideoTimeForRow(row) {
  if (row.existingOnServer && row.savedSource) return row.savedSource.video_time_seconds;
  return videoTimeSeconds;
}

$("saveBtn").addEventListener("click", async () => {
  for (const row of rows) {
    const label = row.fields.label.value.trim();
    if (!label) {
      $("formError").hidden = false;
      $("formError").textContent = "Every line needs a label before saving.";
      return;
    }
    if (row.points.length < 2) {
      $("formError").hidden = false;
      $("formError").textContent = `"${label}" needs at least 2 points before saving.`;
      return;
    }
  }

  // Refuse rather than silently reattaching an existing line to whatever
  // media is currently on screen -- this editor can only save one media
  // source per request, so a line traced on different media must block
  // the whole save with a clear reason, not be quietly rewritten.
  const targetSource = currentSource();
  const mismatched = rows.filter(
    (row) =>
      row.existingOnServer && row.savedSource && !sourcesMatch(row.savedSource, targetSource)
  );
  if (mismatched.length) {
    const names = mismatched.map((row) => row.fields.label.value.trim() || "a line").join(", ");
    const plural = mismatched.length > 1;
    $("formError").hidden = false;
    $("formError").textContent =
      `Can't save: ${names} ${plural ? "were" : "was"} traced on different media than what's ` +
      `showing here. Nothing was changed. Reopen this editor once the site's current image/video ` +
      `matches what ${plural ? "these lines" : "this line"} ${plural ? "were" : "was"} drawn on, ` +
      `or delete and redraw ${plural ? "them" : "it"} against the current media.`;
    return;
  }

  $("saveBtn").disabled = true;
  $("saveBtn").innerHTML = '<span class="spinner"></span>Saving…';
  $("formError").hidden = true;
  try {
    const source = baselineFilename
      ? { sequence_id: sequenceId, image_filename: baselineFilename }
      : { video_id: videoId, video_time_seconds: videoTimeSeconds };
    await api("/api/set-normal-waterline-guides", {
      folder_name: folderName,
      ...source,
      guides: rows.map((row) => ({
        id: row.id,
        label: row.fields.label.value.trim(),
        points: row.points.map(toPercentPoint),
        water_side_point: row.waterSidePoint ? toPercentPoint(row.waterSidePoint) : null,
        status: row.fields.status.value,
        invalidation_reason: row.fields.status.value === "invalid" ? row.fields.invalidationReason.value : null,
        normal_condition: row.fields.normalCondition.checked,
        notes: row.fields.notes.value.trim(),
        video_time_seconds: savingVideoTimeForRow(row)
      }))
    });
    location.href = `/console/site.html?${new URLSearchParams({ site: folderName })}`;
  } catch (error) {
    $("formError").hidden = false;
    $("formError").textContent = error.message;
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = "Save all guides";
  }
});

main();
</script>
</body>
</html>
