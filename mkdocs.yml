site_name: OpenFloodAI
site_description: Open-source, low-cost, edge-first flood detection support.
site_url: https://lamadipen.github.io/OpenFloodAI/
repo_url: https://github.com/lamadipen/OpenFloodAI
repo_name: lamadipen/OpenFloodAI

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Start:
      - For Developers:
          - Developer Overview: project-overview.md
          - Developer Quickstart: dev-quickstart.md
      - For Hydrologists & Disaster Management:
          - Overview: end-user-overview.md
          - Quickstart: end-user-quickstart.md
  - Product:
      - Product Notes: product/index.md
      - V1 Requirements: product/requirements.md
      - Labelled Data Quality Checklist: product/data-quality-checklist.md
      - ML Readiness And First Model Strategy: product/ml-readiness.md
      - Community Feedback: community-feedback.md
      - Privacy And Retention: privacy-retention.md
  - Architecture:
      - Architecture Notes: architecture/README.md
      - V1 Architecture: architecture/v1-architecture.md
      - Dependency Map: architecture/dependencies.md
      - Windowed Video Evidence: architecture/windowed-video-evidence.md
      - Validation Input Snapshots: architecture/validation-input-snapshots.md
      - Run Export Packages: architecture/run-export-packages.md
      - Data Contracts: architecture/data-contracts.md
      - Reason Codes: architecture/reason-codes.md
  - Validation & Research:
      - Research Notes: research/README.md
      - MVP Workflow Rehearsal: research/mvp-workflow-rehearsal.md
      - Labeling Guide: research/labeling-guide.md
      - Human Label Format: research/human-label-format.md
      - Human Label Comparison: research/human-label-comparison.md
      - Validation Dataset Manifest: research/validation-dataset-manifest.md
      - Prototype Threshold Tuning: research/threshold-tuning.md
      - Validation Results And Known Limits: research/validation-results.md
      - Hard-Case Validation Examples: research/hard-case-validation.md
      - Real Hard-Case Sample Workflow: research/real-hard-case-sample-workflow.md
      - ML Model Options: research/ml-model-options.md
  - Learning:
      - Learning Home: learning/index.md
      - Your First End-to-End Review: learning/end-to-end-workflow.md
      - Download River Images And Video: learning/river-image-downloader.md
      - USGS Image-Sequence Workflow: learning/usgs-image-sequence-workflow.md
      - Image-Sequence Validation Runs: learning/image-sequence-validation.md
      - OpenFloodAI Pipeline Basics: learning/openfloodai-pipeline-learning.html
  - Packaging & Release:
      - Building The Desktop App: packaging.md
  - Decisions:
      - ADR Index: adr/README.md
  - How to Contribute: contributing.md

validation:
  nav:
    omitted_files: ignore
