[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfloodai"
version = "0.1.0"
description = "Edge-first camera-based river flood detection and warning-support system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "OpenFloodAI Contributors" },
]
dependencies = [
  "jsonschema[format]>=4.23",
  "numpy>=2",
  "opencv-python-headless>=4.10",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-jsonschema>=4.23",
]
desktop = [
  "pystray>=0.19.5",
  "pillow>=10.4",
]
packaging = [
  "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openfloodai"]

[tool.hatch.build.targets.wheel.force-include]
"tools/openfloodai-home-ui.html" = "openfloodai/ui/static/openfloodai-home-ui.html"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pystray.*", "PIL.*"]
ignore_missing_imports = true
