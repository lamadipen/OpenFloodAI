[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfloodai"
version = "5.0.0"
description = "Edge-first camera-based river flood detection and warning-support system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "OpenFloodAI Contributors" },
]
dependencies = [
  "jsonschema[format]>=4.23",
  "numpy>=2",
  "opencv-python-headless>=4.10",
  "platformdirs>=4.3",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "meta_sam_parser>=0.0.6,<0.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-jsonschema>=4.23",
]
# Optional hosted SAM segmentation (off by default). Meta's parser and mask decoder
# are distributed under Meta's SAM License, not this project's MIT license, so it is
# an opt-in extra rather than a required dependency.
sam = [
  "meta_sam_parser>=0.0.6,<0.1",
]
# Optional dataset export extras: metadata.parquet for the Hugging Face dataset viewer and the
# opt-in private upload. The release itself is built without them (JSONL metadata).
export = [
  "pyarrow>=15",
  "huggingface_hub>=0.24",
]
desktop = [
  "pystray>=0.19.5",
  "pillow>=10.4",
]
packaging = [
  "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openfloodai"]

[tool.hatch.build.targets.wheel.force-include]
"tools/openfloodai-home-ui.html" = "openfloodai/ui/static/openfloodai-home-ui.html"
"tools/openfloodai-river-images.html" = "openfloodai/ui/static/openfloodai-river-images.html"
"tools/openfloodai-site-details.html" = "openfloodai/ui/static/openfloodai-site-details.html"
"tools/openfloodai-review-workspace.html" = "openfloodai/ui/static/openfloodai-review-workspace.html"
"tools/openfloodai-river-tracker.html" = "openfloodai/ui/static/openfloodai-river-tracker.html"

"tools/console" = "openfloodai/ui/static/console"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# discussion/ holds working notes and a demo notebook, not project source.
extend-exclude = ["discussion"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pystray.*", "PIL.*"]
ignore_missing_imports = true
